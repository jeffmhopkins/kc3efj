<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0118">
<title>OUTRUN GRID — Synthwave / Tron CRT Demo</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05010d;
    }
    /* Static CSS fallback shown only if WebGL2 is unavailable */
    #fallback {
        position: fixed;
        inset: 0;
        display: none;
        background:
            radial-gradient(ellipse 60% 38% at 50% 58%, #ff2d95aa, transparent 70%),
            linear-gradient(to bottom, #0a0118 0%, #1a0533 40%, #3b0a5c 58%, #07030f 58.5%, #05010d 100%);
    }
    #fallback::after {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(transparent 0 2px, rgba(0,0,0,.35) 2px 4px);
        pointer-events: none;
    }
    #fallback .msg {
        position: absolute;
        bottom: 14px;
        width: 100%;
        text-align: center;
        font: 12px/1.4 'Courier New', monospace;
        color: #2de2e6;
        text-shadow: 0 0 6px #2de2e6;
    }
    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
    }
</style>
</head>
<body>
<div id="fallback"><div class="msg">WebGL2 unavailable — showing static fallback.</div></div>
<canvas id="gl"></canvas>
<script>
(function () {
    "use strict";

    // ──────────────────────────────────────────────────────────────
    //  CONFIG — every knob lives here (red-team recommendation)
    // ──────────────────────────────────────────────────────────────
    const CONFIG = {
        dprCap:        1.5,       // clamp devicePixelRatio: retina fill-rate guard
        fpsCap:        60,        // frame throttle
        gridScroll:    0.45,      // synthwave floor scroll speed
        horizon:       0.40,      // 0..1 from bottom (=> ~60% from top)

        nodeCount:     90,        // network nodes (mid laptop comfortable)
        nodeCountMob:  55,
        linkDist:      0.17,      // link threshold, fraction of min dimension
        nodeSpeed:     0.018,     // normalized units / second
        mouseRepel:    0.12,      // repel radius (normalized)

        bandY:         [0.16, 0.74], // node field vertical band (keeps it a "network")
        bandX:         [0.06, 0.94],

        pulseEvery:    [1.4, 3.0],   // seconds between new signal pulses
        pulseSpeed:    1.9,          // 1/seconds along an edge
        pulseMax:      14,
        cascadeChance: 0.45,         // chance an arrival re-emits along a neighbour

        bloomStrength: 0.9,
        scanDepth:     0.12,
        curvature:     6.0,          // higher = flatter CRT glass
        chroma:        0.0016,
        vignette:      0.32,

        // palette ("Miami Vice Midnight")
        col: {
            cyan:    [0.18, 0.89, 0.90],
            magenta: [1.00, 0.18, 0.58],
            purple:  [0.73, 0.40, 1.00],
            hot:     [1.00, 0.96, 0.90], // signal core (white-hot)
        }
    };

    const canvas   = document.getElementById('gl');
    const fallback = document.getElementById('fallback');
    const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });

    if (!gl) {
        canvas.style.display = 'none';
        fallback.style.display = 'block';
        return;
    }

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = window.innerWidth <= 768 || 'ontouchstart' in window;

    // ──────────────────────────────────────────────────────────────
    //  Shader sources
    // ──────────────────────────────────────────────────────────────
    const VS_QUAD = `#version 300 es
    layout(location = 0) in vec2 aPos;
    out vec2 vUv;
    void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

    // Scene: procedural sky + retro sun + perspective grid floor
    const FS_SCENE = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;
    uniform vec2  uRes;
    uniform float uTime;
    uniform vec2  uMouse;     // -1..1 parallax
    uniform float uScroll;
    uniform float uHorizon;
    uniform vec3  uCyan;
    uniform vec3  uMagenta;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    void main(){
        vec2 uv = vUv;                       // 0..1, y up
        float aspect = uRes.x / uRes.y;
        float horizon = uHorizon;
        vec3 col;

        if (uv.y < horizon) {
            // ---- perspective grid floor ----
            float depth = horizon - uv.y;
            float z  = 0.20 / (depth + 0.0008);
            float xw = (uv.x - 0.5) * aspect * z * 0.6;
            float yw = z + uTime * uScroll;
            vec2  g  = vec2(xw, yw);
            vec2  gf = abs(fract(g) - 0.5);
            vec2  dd = gf / fwidth(g);                 // resolution-independent AA lines
            float line = 1.0 - clamp(min(dd.x, dd.y), 0.0, 1.0);
            float fade = exp(-z * 0.18);
            vec3  gcol = mix(uCyan, uMagenta, clamp(uv.x, 0.0, 1.0));
            col  = vec3(0.03, 0.006, 0.07);            // floor base
            col += gcol * line * fade * 1.35;
        } else {
            // ---- sky gradient ----
            float t = (uv.y - horizon) / (1.0 - horizon);
            vec3 skyHorizon = vec3(0.42, 0.10, 0.40);
            vec3 skyMid     = vec3(0.10, 0.02, 0.20);
            vec3 skyTop     = vec3(0.039, 0.004, 0.094);
            col = mix(skyHorizon, skyMid, smoothstep(0.0, 0.45, t));
            col = mix(col, skyTop, smoothstep(0.35, 1.0, t));
            // ---- stars (upper sky only) ----
            vec2 sp = floor(uv * vec2(aspect, 1.0) * 140.0);
            float h = hash(sp);
            float star = step(0.988, h) * smoothstep(0.12, 0.6, t);
            float tw = 0.5 + 0.5 * sin(uTime * 2.5 + h * 40.0);
            col += vec3(0.8, 0.9, 1.0) * star * tw;
        }

        // ---- retro sun (overlaid across whole frame so it bleeds over grid) ----
        float sunX  = 0.5 + uMouse.x * 0.02;
        float sunR  = 0.17;
        float sunCY = horizon + sunR * 0.55;
        vec2  p = vec2((uv.x - sunX) * aspect, uv.y - sunCY);
        float r = length(p);
        float disc = smoothstep(sunR, sunR - 0.004, r);
        float gpos = (uv.y - (sunCY - sunR)) / (2.0 * sunR);   // 0 bottom .. 1 top
        vec3  sunCol = mix(vec3(1.0,0.85,0.42), vec3(1.0,0.20,0.60), clamp(gpos,0.0,1.0));
        // horizontal slits in lower half, thickening downward
        float slit = 1.0;
        float sy = sunCY - uv.y;
        if (sy > 0.0) {
            float k = clamp(sy / sunR, 0.0, 1.0);
            float lines = fract(uv.y * 55.0);
            slit = 1.0 - step(lines, clamp(k * 0.95, 0.0, 0.85));
        }
        col = mix(col, sunCol, disc * slit);
        col += vec3(1.0, 0.32, 0.52) * exp(-r * 7.0) * 0.5;     // sun glow

        // bright cyan horizon seam
        col += uCyan * exp(-abs(uv.y - horizon) * 220.0) * 0.6;

        fragColor = vec4(col, 1.0);
    }`;

    // Network lines (additive)
    const VS_LINE = `#version 300 es
    layout(location = 0) in vec2 aPos;
    layout(location = 1) in float aAlpha;
    layout(location = 2) in vec3 aCol;
    out float vA; out vec3 vC;
    void main(){ vA = aAlpha; vC = aCol; gl_Position = vec4(aPos,0.0,1.0); }`;
    const FS_LINE = `#version 300 es
    precision highp float;
    in float vA; in vec3 vC; out vec4 o;
    void main(){ o = vec4(vC * vA, 1.0); }`;

    // Network points / pulses (additive, soft radial sprite)
    const VS_PT = `#version 300 es
    layout(location = 0) in vec2 aPos;
    layout(location = 1) in float aSize;
    layout(location = 2) in vec3 aCol;
    out vec3 vC;
    void main(){ vC = aCol; gl_PointSize = aSize; gl_Position = vec4(aPos,0.0,1.0); }`;
    const FS_PT = `#version 300 es
    precision highp float;
    in vec3 vC; out vec4 o;
    void main(){
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d);
        o = vec4(vC * a, 1.0);
    }`;

    // Bloom bright-pass
    const FS_BRIGHT = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 o;
    uniform sampler2D uTex;
    void main(){
        vec3 c = texture(uTex, vUv).rgb;
        float l = max(max(c.r, c.g), c.b);
        o = vec4(c * smoothstep(0.55, 0.95, l), 1.0);
    }`;

    // Separable gaussian blur
    const FS_BLUR = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 o;
    uniform sampler2D uTex;
    uniform vec2 uDir;
    void main(){
        vec3 c = texture(uTex, vUv).rgb * 0.227;
        c += texture(uTex, vUv + uDir*1.0).rgb * 0.194;
        c += texture(uTex, vUv - uDir*1.0).rgb * 0.194;
        c += texture(uTex, vUv + uDir*2.0).rgb * 0.121;
        c += texture(uTex, vUv - uDir*2.0).rgb * 0.121;
        c += texture(uTex, vUv + uDir*3.0).rgb * 0.054;
        c += texture(uTex, vUv - uDir*3.0).rgb * 0.054;
        o = vec4(c, 1.0);
    }`;

    // CRT composite
    const FS_CRT = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 fragColor;
    uniform sampler2D uScene;
    uniform sampler2D uBloom;
    uniform vec2  uRes;
    uniform float uTime;
    uniform float uReduced;
    uniform float uCurve;
    uniform float uChroma;
    uniform float uScanDepth;
    uniform float uVignette;
    uniform float uBloomStr;

    vec2 barrel(vec2 uv){
        vec2 c = uv * 2.0 - 1.0;
        vec2 off = abs(c.yx) / uCurve;
        c += c * off * off;
        return c * 0.5 + 0.5;
    }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.545); }

    void main(){
        vec2 uv = barrel(vUv);
        if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0){
            fragColor = vec4(0.0, 0.0, 0.0, 1.0); return;
        }
        vec2 dir = uv - 0.5;
        // chromatic aberration grows with distance from centre
        float r = texture(uScene, uv - dir * uChroma).r;
        float g = texture(uScene, uv).g;
        float b = texture(uScene, uv + dir * uChroma).b;
        vec3 col = vec3(r, g, b);

        col += texture(uBloom, uv).rgb * uBloomStr;     // additive bloom

        // scanlines (fixed count for a chunky tube look), drift when not reduced
        float scan = 0.5 + 0.5 * sin(uv.y * 620.0 - uTime * 8.0 * (1.0 - uReduced));
        col *= 1.0 - uScanDepth * scan;

        // aperture-grille RGB triads
        float m = mod(gl_FragCoord.x, 3.0);
        vec3 mask = vec3(0.9);
        if (m < 1.0) mask.r = 1.0; else if (m < 2.0) mask.g = 1.0; else mask.b = 1.0;
        col *= mask;

        // rolling band + mains flicker (subtle, killed under reduced-motion)
        float roll = 0.5 + 0.5 * sin((uv.y + uTime * 0.10) * 6.28318);
        col *= 1.0 + 0.025 * roll * (1.0 - uReduced);
        col *= 1.0 + 0.012 * sin(uTime * 50.0) * (1.0 - uReduced);

        col += (hash(uv * uRes + uTime) - 0.5) * 0.03;  // grain

        float vig = 1.0 - uVignette * dot(dir, dir) * 2.2;
        col *= clamp(vig, 0.0, 1.0);

        fragColor = vec4(col, 1.0);
    }`;

    // ──────────────────────────────────────────────────────────────
    //  GL helpers
    // ──────────────────────────────────────────────────────────────
    function compile(type, src){
        const s = gl.createShader(type);
        gl.shaderSource(s, src.trim());
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
            throw new Error(gl.getShaderInfoLog(s) + "\n" + src);
        return s;
    }
    function program(vs, fs){
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS))
            throw new Error(gl.getProgramInfoLog(p));
        return p;
    }
    function uniforms(p){
        const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
        for (let i = 0; i < n; i++){ const info = gl.getActiveUniform(p, i);
            u[info.name] = gl.getUniformLocation(p, info.name); }
        return u;
    }

    let GL = {};          // programs + uniform maps, (re)built on context restore
    let fboScene, fboA, fboB;   // framebuffers
    let quadVAO, lineVAO, ptVAO;
    let lineBuf, ptBuf;
    let sw, sh, bw, bh;   // scene + bloom dimensions

    function makeFBO(w, h){
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        const fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        return { fb, tex, w, h };
    }

    const NODE_MAX  = CONFIG.nodeCount;
    const LINE_FLOATS = NODE_MAX * NODE_MAX * 6;   // 2 verts * (2 pos+1 alpha+3 col) upper bound, generous
    const PT_FLOATS   = (NODE_MAX + CONFIG.pulseMax) * 6;

    function buildGL(){
        GL.scene  = program(VS_QUAD, FS_SCENE);   GL.sceneU  = uniforms(GL.scene);
        GL.line   = program(VS_LINE, FS_LINE);
        GL.pt     = program(VS_PT,   FS_PT);
        GL.bright = program(VS_QUAD, FS_BRIGHT);  GL.brightU = uniforms(GL.bright);
        GL.blur   = program(VS_QUAD, FS_BLUR);    GL.blurU   = uniforms(GL.blur);
        GL.crt    = program(VS_QUAD, FS_CRT);     GL.crtU    = uniforms(GL.crt);

        // fullscreen quad
        const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
        quadVAO = gl.createVertexArray();
        gl.bindVertexArray(quadVAO);
        const qb = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, qb);
        gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);   // aPos at loc 0

        // line VAO: interleaved [x,y,alpha,r,g,b] stride 24
        lineVAO = gl.createVertexArray();
        gl.bindVertexArray(lineVAO);
        lineBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
        gl.bufferData(gl.ARRAY_BUFFER, LINE_FLOATS * 4, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 24, 8);
        gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 24, 12);

        // point VAO: interleaved [x,y,size,r,g,b] stride 24
        ptVAO = gl.createVertexArray();
        gl.bindVertexArray(ptVAO);
        ptBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
        gl.bufferData(gl.ARRAY_BUFFER, PT_FLOATS * 4, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 24, 8);
        gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 24, 12);

        gl.bindVertexArray(null);
    }

    function freeFBO(f){ if (f){ gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); } }

    function allocFBOs(){
        freeFBO(fboScene); freeFBO(fboA); freeFBO(fboB);   // avoid leaking on resize
        const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
        sw = Math.max(2, Math.floor(window.innerWidth  * dpr));
        sh = Math.max(2, Math.floor(window.innerHeight * dpr));
        bw = Math.max(1, sw >> 1);
        bh = Math.max(1, sh >> 1);
        canvas.width  = sw; canvas.height = sh;
        canvas.style.width  = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        fboScene = makeFBO(sw, sh);
        fboA = makeFBO(bw, bh);
        fboB = makeFBO(bw, bh);
    }

    // ──────────────────────────────────────────────────────────────
    //  Node network simulation
    // ──────────────────────────────────────────────────────────────
    const N = isMobile ? CONFIG.nodeCountMob : CONFIG.nodeCount;
    let nodes = [];
    let adjacency = [];           // per-node neighbour list (rebuilt each frame)
    let pulses = [];
    let nextPulse = 0;
    let mouse = { x: 0.5, y: 0.5, active: false };

    function rand(a, b){ return a + Math.random() * (b - a); }

    function initNodes(){
        nodes = [];
        for (let i = 0; i < N; i++){
            const ang = Math.random() * Math.PI * 2;
            const sp  = CONFIG.nodeSpeed * rand(0.4, 1.0);
            nodes.push({
                x: rand(CONFIG.bandX[0], CONFIG.bandX[1]),
                y: rand(CONFIG.bandY[0], CONFIG.bandY[1]),
                vx: Math.cos(ang) * sp,
                vy: Math.sin(ang) * sp,
                r: rand(0, 1),                 // size seed; a few become hubs
                flash: 0
            });
        }
        pulses = [];
        nextPulse = rand(CONFIG.pulseEvery[0], CONFIG.pulseEvery[1]);
    }

    // clip-space helpers (normalized y-down -> clip y-up)
    const cx = nx => nx * 2 - 1;
    const cy = ny => 1 - ny * 2;

    function updateSim(dt){
        const [y0, y1] = CONFIG.bandY, [x0, x1] = CONFIG.bandX;
        for (const n of nodes){
            // gentle mouse repel
            if (mouse.active){
                const dx = n.x - mouse.x, dy = n.y - mouse.y;
                const d = Math.hypot(dx, dy);
                if (d < CONFIG.mouseRepel && d > 1e-4){
                    const f = (1 - d / CONFIG.mouseRepel) * 0.06;
                    n.vx += (dx / d) * f * dt * 60;
                    n.vy += (dy / d) * f * dt * 60;
                }
            }
            n.x += n.vx * dt; n.y += n.vy * dt;
            // soft bounce inside the band
            if (n.x < x0){ n.x = x0; n.vx = Math.abs(n.vx); }
            if (n.x > x1){ n.x = x1; n.vx = -Math.abs(n.vx); }
            if (n.y < y0){ n.y = y0; n.vy = Math.abs(n.vy); }
            if (n.y > y1){ n.y = y1; n.vy = -Math.abs(n.vy); }
            // velocity damping toward base speed so repel doesn't accumulate
            const v = Math.hypot(n.vx, n.vy), base = CONFIG.nodeSpeed * 0.8;
            if (v > base * 2.2){ n.vx *= 0.96; n.vy *= 0.96; }
            n.flash *= Math.pow(0.02, dt);   // ~decay
        }

        // rebuild adjacency (O(n^2) — fine at this N) with aspect-corrected distance
        const aspect = sw / sh;
        const thr = CONFIG.linkDist, thr2 = thr * thr;
        adjacency = nodes.map(() => []);
        linkList.length = 0;
        for (let i = 0; i < N; i++){
            for (let j = i + 1; j < N; j++){
                const dx = (nodes[i].x - nodes[j].x) * aspect;
                const dy = nodes[i].y - nodes[j].y;
                const d2 = dx * dx + dy * dy;
                if (d2 < thr2){
                    const d = Math.sqrt(d2);
                    const a = Math.pow(1 - d / thr, 1.3) * 0.5;
                    linkList.push(i, j, a);
                    adjacency[i].push(j);
                    adjacency[j].push(i);
                }
            }
        }

        // spawn pulses
        nextPulse -= dt;
        if (nextPulse <= 0 && linkList.length && pulses.length < CONFIG.pulseMax){
            const k = (Math.floor(Math.random() * (linkList.length / 3))) * 3;
            pulses.push({ a: linkList[k], b: linkList[k + 1], t: 0,
                          sp: CONFIG.pulseSpeed * rand(0.8, 1.2) });
            nextPulse = rand(CONFIG.pulseEvery[0], CONFIG.pulseEvery[1]);
        }
        // advance pulses
        for (let i = pulses.length - 1; i >= 0; i--){
            const p = pulses[i];
            p.t += p.sp * dt;
            if (p.t >= 1){
                nodes[p.b].flash = 1;                    // arrival flash
                if (Math.random() < CONFIG.cascadeChance && pulses.length < CONFIG.pulseMax){
                    const nb = adjacency[p.b];
                    if (nb.length){
                        const next = nb[Math.floor(Math.random() * nb.length)];
                        pulses.push({ a: p.b, b: next, t: 0,
                                      sp: CONFIG.pulseSpeed * rand(0.8, 1.2) });
                    }
                }
                pulses.splice(i, 1);
            }
        }
    }

    const linkList = [];          // flat [i,j,alpha, ...]
    const lineData = new Float32Array(LINE_FLOATS);
    const ptData   = new Float32Array(PT_FLOATS);

    function easeOut(t){ return 1 - Math.pow(1 - t, 3); }

    function buildGeometry(){
        const C = CONFIG.col;
        // lines
        let li = 0;
        for (let k = 0; k < linkList.length; k += 3){
            const i = linkList[k], j = linkList[k + 1], a = linkList[k + 2];
            // colour lerps cyan->magenta by midpoint x
            const mx = (nodes[i].x + nodes[j].x) * 0.5;
            const cr = C.cyan[0] + (C.magenta[0] - C.cyan[0]) * mx;
            const cg = C.cyan[1] + (C.magenta[1] - C.cyan[1]) * mx;
            const cb = C.cyan[2] + (C.magenta[2] - C.cyan[2]) * mx;
            lineData[li++] = cx(nodes[i].x); lineData[li++] = cy(nodes[i].y);
            lineData[li++] = a; lineData[li++] = cr; lineData[li++] = cg; lineData[li++] = cb;
            lineData[li++] = cx(nodes[j].x); lineData[li++] = cy(nodes[j].y);
            lineData[li++] = a; lineData[li++] = cr; lineData[li++] = cg; lineData[li++] = cb;
        }
        const lineVerts = li / 6;

        // node points
        let pi = 0;
        const sizeBase = (isMobile ? 4.5 : 5.5) * Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
        for (const n of nodes){
            const hub = n.r > 0.85 ? 1.6 : 1.0;
            const size = sizeBase * hub * (1 + n.flash * 0.9);
            // base cyan, flashing toward magenta
            const f = n.flash;
            const r = C.cyan[0] + (C.magenta[0] - C.cyan[0]) * f;
            const g = C.cyan[1] + (C.magenta[1] - C.cyan[1]) * f;
            const b = C.cyan[2] + (C.magenta[2] - C.cyan[2]) * f;
            const bright = 0.7 + 0.6 * f;
            ptData[pi++] = cx(n.x); ptData[pi++] = cy(n.y); ptData[pi++] = size;
            ptData[pi++] = r * bright; ptData[pi++] = g * bright; ptData[pi++] = b * bright;
        }
        // pulse points (white-hot, eased)
        for (const p of pulses){
            const t = easeOut(Math.min(p.t, 1));
            const x = nodes[p.a].x + (nodes[p.b].x - nodes[p.a].x) * t;
            const y = nodes[p.a].y + (nodes[p.b].y - nodes[p.a].y) * t;
            ptData[pi++] = cx(x); ptData[pi++] = cy(y); ptData[pi++] = sizeBase * 1.5;
            ptData[pi++] = C.hot[0]; ptData[pi++] = C.hot[1]; ptData[pi++] = C.hot[2];
        }
        const ptVerts = pi / 6;

        return { lineVerts, ptVerts, lineFloats: li, ptFloats: pi };
    }

    // ──────────────────────────────────────────────────────────────
    //  Render
    // ──────────────────────────────────────────────────────────────
    function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

    function render(timeSec){
        const C = CONFIG.col;
        const geo = buildGeometry();

        // --- Pass 1: scene -> fboScene ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene.fb);
        gl.viewport(0, 0, sw, sh);
        gl.disable(gl.BLEND);
        gl.useProgram(GL.scene);
        gl.uniform2f(GL.sceneU.uRes, sw, sh);
        gl.uniform1f(GL.sceneU.uTime, timeSec);
        gl.uniform2f(GL.sceneU.uMouse, (mouse.x - 0.5) * 2, (mouse.y - 0.5) * 2);
        gl.uniform1f(GL.sceneU.uScroll, reduced ? 0.0 : CONFIG.gridScroll);
        gl.uniform1f(GL.sceneU.uHorizon, CONFIG.horizon);
        gl.uniform3fv(GL.sceneU.uCyan, C.cyan);
        gl.uniform3fv(GL.sceneU.uMagenta, C.magenta);
        drawQuad();

        // network drawn additively on top (into the same FBO so bloom sees it)
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        if (geo.lineVerts){
            gl.useProgram(GL.line);
            gl.bindVertexArray(lineVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, lineData, 0, geo.lineFloats);
            gl.drawArrays(gl.LINES, 0, geo.lineVerts);
        }
        if (geo.ptVerts){
            gl.useProgram(GL.pt);
            gl.bindVertexArray(ptVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, ptData, 0, geo.ptFloats);
            gl.drawArrays(gl.POINTS, 0, geo.ptVerts);
        }
        gl.disable(gl.BLEND);

        // --- Pass 2: bright-pass -> fboA (half res) ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb);
        gl.viewport(0, 0, bw, bh);
        gl.useProgram(GL.bright);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboScene.tex);
        gl.uniform1i(GL.brightU.uTex, 0);
        drawQuad();

        // --- Pass 3: blur H (fboA->fboB) then V (fboB->fboA) ---
        gl.useProgram(GL.blur);
        gl.uniform1i(GL.blurU.uTex, 0);
        // horizontal
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboB.fb);
        gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
        gl.uniform2f(GL.blurU.uDir, 1.0 / bw, 0.0);
        drawQuad();
        // vertical
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb);
        gl.bindTexture(gl.TEXTURE_2D, fboB.tex);
        gl.uniform2f(GL.blurU.uDir, 0.0, 1.0 / bh);
        drawQuad();

        // --- Pass 4: CRT composite -> screen ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, sw, sh);
        gl.useProgram(GL.crt);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboScene.tex);
        gl.uniform1i(GL.crtU.uScene, 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
        gl.uniform1i(GL.crtU.uBloom, 1);
        gl.uniform2f(GL.crtU.uRes, sw, sh);
        gl.uniform1f(GL.crtU.uTime, timeSec);
        gl.uniform1f(GL.crtU.uReduced, reduced ? 1.0 : 0.0);
        gl.uniform1f(GL.crtU.uCurve, CONFIG.curvature);
        gl.uniform1f(GL.crtU.uChroma, CONFIG.chroma);
        gl.uniform1f(GL.crtU.uScanDepth, CONFIG.scanDepth);
        gl.uniform1f(GL.crtU.uVignette, CONFIG.vignette);
        gl.uniform1f(GL.crtU.uBloomStr, CONFIG.bloomStrength);
        drawQuad();
        gl.bindVertexArray(null);
    }

    // ──────────────────────────────────────────────────────────────
    //  Main loop
    // ──────────────────────────────────────────────────────────────
    let start = 0, lastFrame = 0, lastSim = 0, raf = 0;
    const frameMin = 1000 / CONFIG.fpsCap;

    function loop(now){
        raf = requestAnimationFrame(loop);
        if (now - lastFrame < frameMin) return;
        lastFrame = now;
        if (!start) { start = now; lastSim = now; }
        const dt = Math.min(0.05, (now - lastSim) / 1000);
        lastSim = now;
        updateSim(dt);
        render((now - start) / 1000);
    }

    function renderStatic(){
        // single frame for prefers-reduced-motion (no loop, no pulses)
        updateSim(0);
        render(0);
    }

    // ──────────────────────────────────────────────────────────────
    //  Events
    // ──────────────────────────────────────────────────────────────
    function setMouse(clientX, clientY){
        mouse.x = clientX / window.innerWidth;
        mouse.y = clientY / window.innerHeight;
        mouse.active = true;
    }
    window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
    window.addEventListener('mouseleave', () => mouse.active = false);
    window.addEventListener('touchmove', e => {
        if (e.touches.length) setMouse(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    let resizeT;
    window.addEventListener('resize', () => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
            allocFBOs();
            if (reduced) renderStatic();
        }, 120);
    });

    // pause when tab hidden (battery / thermal)
    document.addEventListener('visibilitychange', () => {
        if (reduced) return;
        if (document.hidden){ cancelAnimationFrame(raf); raf = 0; }
        else if (!raf){ lastFrame = 0; lastSim = performance.now(); raf = requestAnimationFrame(loop); }
    });

    // WebGL context loss / restore
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; }, false);
    canvas.addEventListener('webglcontextrestored', () => {
        buildGL(); allocFBOs(); initNodes();
        if (reduced) renderStatic(); else { lastFrame = 0; start = 0; raf = requestAnimationFrame(loop); }
    }, false);

    // ──────────────────────────────────────────────────────────────
    //  Boot
    // ──────────────────────────────────────────────────────────────
    try {
        buildGL();
        allocFBOs();
        initNodes();
        if (reduced) renderStatic();
        else raf = requestAnimationFrame(loop);
    } catch (err) {
        console.error(err);
        canvas.style.display = 'none';
        fallback.style.display = 'block';
    }
})();
</script>
</body>
</html>
