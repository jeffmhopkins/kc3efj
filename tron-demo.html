    function makeTurret(){
        const z = rand(9, 40), aspT = sw / sh;   // can spawn far back too (rides in slowly)
        // keep it on-screen the whole ride: the grid spreads x outward as z shrinks, so bound the
        // world-x by the spread at the near (despawn) end, against the off-centre vanishing point.
        const maxOff = Math.max(0.12, 0.40 - Math.abs(cam.headSend));
        const xMax = maxOff * aspT * 1.0 * 0.6 * 2;   // doubled spawn x-width (may exit a side before the bottom)
        const x = rand(-1, 1) * xMax;
        return { x, z, h: 0, isTurret: true, target: null, switchCool: 0, fireCool: CONFIG.turretFireGap, shotCool: 0, aim: { x, h: 0.2, z: z + 1 } };
    }

    function updateFX(dt){
        if (reduced) return;
        const side = () => Math.random() < 0.5;

        // shooting stars (frequent, fast, sky)
        FX.nextStar -= dt;
        if (FX.nextStar <= 0 && FX.stars.length < 2){
            const L = side();
            FX.stars.push({ x: L ? -0.1 : 1.1, y: rand(0.08, 0.38),   // upper sky (y-down)
                vx: (L ? 1 : -1) * rand(1.0, 1.4), vy: rand(0.10, 0.25),  // slight descent
                depth: rand(0.2, 0.6), col: Math.random() < 0.5 ? CONFIG.col.cyan : CONFIG.col.hot });
            FX.nextStar = rand(CONFIG.starGap[0], CONFIG.starGap[1]);
        }
        // comet (rare, big, slow)
        FX.nextComet -= dt;
        if (FX.nextComet <= 0 && FX.comets.length < 1 && !FX.squad){
            const L = side();
            FX.comets.push({ x: L ? -0.12 : 1.12, y: rand(0.06, 0.26),   // high sky (y-down)
                vx: (L ? 1 : -1) * rand(0.20, 0.32), vy: rand(0.03, 0.08), depth: 0.35 });
            FX.nextComet = rand(CONFIG.cometGap[0], CONFIG.cometGap[1]);
        }
        // tumbling wireframe polyhedron (mid)
        FX.nextPoly -= dt;
        if (FX.nextPoly <= 0 && FX.polys.length < 1){
            FX.polys.push({ u: -0.15, speed: rand(0.06, 0.10), y: rand(0.20, 0.46),
                depth: rand(0.45, 0.8), dir: side() ? 1 : -1, isPoly: true,
                rx: rand(0, 6.28), ry: rand(0, 6.28), wx: rand(0.2, 0.5), wy: rand(0.3, 0.6),
                scale: rand(0.05, 0.09), col: Math.random() < 0.5 ? CONFIG.col.cyan : CONFIG.col.purple });
            FX.nextPoly = rand(CONFIG.polyGap[0], CONFIG.polyGap[1]);
        }
        // light-cycle grid streak (floor)
        FX.nextCycle -= dt;
        if (FX.nextCycle <= 0 && FX.cycles.length < 1 && !FX.squad){
            FX.cycles.push({ u: 0, speed: rand(0.18, 0.30), z: rand(2.5, 6.0), dir: side() ? 1 : -1,
                col: Math.random() < 0.5 ? CONFIG.col.cyan : CONFIG.col.purple });
            FX.nextCycle = rand(CONFIG.cycleGap[0], CONFIG.cycleGap[1]);
        }
        // glyph cluster (faint, mid/sky) — rarest, lowest key
        FX.nextGlyph -= dt;
        if (FX.nextGlyph <= 0 && FX.glyphs.length < 1 && !FX.squad){
            const L = side(), n = 4 + (Math.random() * 3 | 0), marks = [];
            for (let i = 0; i < n; i++) marks.push({ dx: rand(-0.03, 0.03), dy: rand(-0.04, 0.04), ph: rand(0, 6.28) });
            FX.glyphs.push({ x: L ? -0.06 : 1.06, y: rand(0.15, 0.48),
                vx: (L ? 1 : -1) * rand(0.05, 0.08), marks, col: Math.random() < 0.5 ? CONFIG.col.cyan : CONFIG.col.purple });
            FX.nextGlyph = rand(CONFIG.glyphGap[0], CONFIG.glyphGap[1]);
        }

        // Star Fox wingmate squadron (single instance; suppresses lesser cameos while live)
        if (!FX.squad){
            FX.nextShip -= dt;                            // 90s gap counts only while sky is empty
            if (FX.nextShip <= 0) FX.squad = makeSquad();
        } else {
            FX.squad.t += dt;
            if (FX.squad.t > FX.squad.endT + 1){          // all ships arrived, held, and departed
                FX.squad = null;
                FX.nextShip = rand(CONFIG.shipGap[0], CONFIG.shipGap[1]);
            }
        }

        // sporadic distant ships transiting side-to-side (ambient; runs independently).
        // while a capital ship is visible the sky gets busier: twice the spawn rate, more on-screen at once.
        const capVis = !!(FX.capital && FX.capital.onScreen);
        FX.nextTransit -= dt;
        if (FX.nextTransit <= 0 && FX.transits.length < (capVis ? 4 : 2)){
            const dir = Math.random() < 0.5 ? 1 : -1, z = rand(12, 88);   // deeper range — some pass far out
            const span = z * 0.6 * (sw / sh) * 0.85;
            // own heading varies off pure tangent: angle from +z (forward), ~90deg +/- up to ~50deg
            const sp = rand(0.6, 2.6), dev = rand(-0.9, 0.9);   // varied speed + heading
            const ang = (dir > 0 ? Math.PI / 2 : -Math.PI / 2) - dir * dev;
            const ovx = Math.sin(ang) * sp, ovz = Math.cos(ang) * sp;
            const theta = rand(0, 20) * Math.PI / 180;          // climb randomized 0-20deg (as drawn on screen)
            const ovy = (Math.abs(ovx) / (sw / sh)) * Math.tan(theta);   // matches on-screen rise to theta
            const vmag = Math.hypot(ovx, ovy, ovz);
            // bank into the crossing so the wing planform faces us — a near-tangent heading
            // viewed edge-on (roll 0) collapses the flat hull to a thin line. Tilt the dorsal
            // side toward the camera (sign = -dir), magnitude enough to show the wings.
            const roll = -dir * rand(0.55, 1.0);
            FX.transits.push({ x: dir > 0 ? -span : span, z, h: rand(0.10, 0.45),
                ovx, ovz, ovy, roll,
                yaw: Math.atan2(ovx, Math.abs(ovz) < 1e-3 ? 1e-3 : ovz),
                pitch: -Math.asin(ovy / vmag),                  // nose + jet aligned to true heading
                plume: rand(0.5, 1.7),                          // varied jet plume strength
                model: Math.random() * SHIP_MODELS.length | 0, scaleMul: rand(1.3, 2.1) });
            FX.nextTransit = rand(CONFIG.transitGap[0], CONFIG.transitGap[1]) * (capVis ? 0.5 : 1);
        }
        const aspT = sw / sh;
        for (let i = FX.transits.length - 1; i >= 0; i--){
            const tr = FX.transits[i];
            tr.x += tr.ovx * dt; tr.z += (tr.ovz - CONFIG.gridScroll) * dt; tr.h += tr.ovy * dt;
            const zc = Math.max(0.5, tr.z), inv = 1 / (zc * 0.6);
            const uvx = 0.5 + cam.headSend + tr.x * inv / aspT;
            const uvy = (CONFIG.horizon + cam.pitchSend) - 0.20 / zc + tr.h * inv;   // y-up
            if (tr.dead || tr.z < 1.0 || tr.z > 120 || uvx < -0.4 || uvx > 1.4 || uvy > 1.35) FX.transits.splice(i, 1);
        }

        // ── space battle: formation snipes crossing craft; the capital ship fires back ──
        const CY = CONFIG.col.cyan, CAPC = CONFIG.col.cap;
        const gsB = reduced ? 0 : CONFIG.gridScroll, aspB = sw / sh;
        const cap = FX.capital;
        if (FX.squad){
            const sq = FX.squad, t = sq.t;
            // any non-dead squad member that is currently on stage can fire — arriving, holding OR departing
            const canFire = sh => !sh.dead && sh.wx !== undefined && t >= sh.arriveAt && t < sh.departAt + sh.depDur;
            const onScr = (x, z, h) => {
                const zc = Math.max(0.5, z), inv = 1 / (zc * 0.6);
                const uvx = 0.5 + cam.headSend + x * inv / aspB;
                const uvy = (CONFIG.horizon + cam.pitchSend) - 0.20 / zc + h * inv;   // y-up
                return { on: uvx > 0 && uvx < 1 && uvy > 0 && uvy < 1, uvx };
            };
            // back-project a sky screen point to a world aim point at a chosen depth (for the polyhedra)
            const skyToWorld = (uvx, uvyUp, z) => {
                const inv = 1 / (z * 0.6);
                return { x: (uvx - 0.5 - cam.headSend) * aspB / inv,
                         h: (uvyUp - (CONFIG.horizon + cam.pitchSend) + 0.20 / z) / inv, z };
            };
            // everything currently visible on screen is a valid target (no cone — anything they can see)
            const targets = [];
            for (const tr of FX.transits){
                if (tr.dead || tr.z < 2.5) continue;
                const v = onScr(tr.x, tr.z, tr.h);
                if (!v.on || v.uvx < 0.1 || v.uvx > 0.9) continue;    // transits: only once >=10% onto the screen
                targets.push({ obj: tr, ax: tr.x, ah: tr.h, az: tr.z, vx: tr.ovx, vy: tr.ovy, vz: tr.ovz - gsB, acc: CONFIG.boltAccuracy });
            }
            if (cap && !cap.dead && cap.onScreen)
                targets.push({ obj: cap, ax: cap.x, ah: cap.h, az: cap.z, vx: cap.ovx, vy: cap.ovy, vz: cap.ovz, acc: CONFIG.capHitChance });
            if (FX.turret && onScr(FX.turret.x, FX.turret.z, FX.turret.h).on){
                const tu = FX.turret;
                targets.push({ obj: tu, ax: tu.x, ah: tu.h, az: tu.z, vx: 0, vy: 0, vz: -gsB, acc: CONFIG.boltAccuracy });
            }
            for (const p of FX.polys){                                // tumbling polyhedra (mapped from sky to world)
                if (p.dead) continue;
                const path = p.dir > 0 ? (-0.2 + 1.4 * p.u) : (1.2 - 1.4 * p.u);
                const ox = path + cam.headSend * (0.04 + p.depth * 0.10);
                if (ox < 0.06 || ox > 0.94) continue;                 // only while comfortably on screen
                const w = skyToWorld(ox, 1 - p.y, 6 + p.depth * 6);
                targets.push({ obj: p, ax: w.x, ah: w.h, az: w.z, vx: 0, vy: 0, vz: 0, acc: CONFIG.boltAccuracy });
            }

            // every on-screen squad member fires independently (all may fire at once), at a random visible target
            for (const sh of sq.ships){
                if (sh.fireCool > 0) sh.fireCool -= dt;
                if (!canFire(sh) || !targets.length) continue;
                if (!onScr(sh.wx, sh.wz, sh.wh).on) continue;         // the shooter must be on screen too
                if (sh.fireCool > 0) continue;
                sh.fireCool = CONFIG.blastCooldown;
                if (Math.random() >= CONFIG.blastFireProb) continue;
                const ts = targets[Math.random() * targets.length | 0];
                const Sxy = CONFIG.shipScale * sh.scaleMul, from = { x: sh.wx, h: sh.wh, z: sh.wz };  // muzzle at the ship
                fireVolley(from, Sxy * 0.45, leadAim(from, ts.ax, ts.ah, ts.az, ts.vx, ts.vy, ts.vz), ts.obj, 'ally', CY, ts.acc);
            }
        }

        // capital RETURNS FIRE — only while it is itself on-screen; targets any on-stage fighter AND transits
        if (cap && !cap.dead && cap.onScreen && cap.backCool <= 0){
            const pool = [];
            if (FX.squad){ const sq = FX.squad, t = sq.t;       // any squad member on stage, slotted or maneuvering
                for (const sh of sq.ships) if (!sh.dead && sh.wx !== undefined && t >= sh.arriveAt && t < sh.departAt + sh.depDur) pool.push(sh); }
            for (const tr of FX.transits) if (!tr.dead && tr.z > 4) pool.push(tr);
            if (pool.length){
                cap.backCool = CONFIG.capFireGap;
                if (Math.random() < CONFIG.capFireProb){
                    const tgt = pool[Math.random() * pool.length | 0];
                    const capSxy = CONFIG.shipScale * cap.scaleMul, from = { x: cap.x, h: cap.h, z: cap.z - capSxy * 0.5 };
                    let aim;
                    if (tgt.slot) aim = { x: tgt.wx, h: tgt.wh, z: tgt.wz };   // live position (in slot or in transit)
                    else aim = leadAim(from, tgt.x, tgt.h, tgt.z, tgt.ovx, tgt.ovy, tgt.ovz - gsB);
                    fireVolley(from, capSxy * 0.35, aim, tgt, 'enemy', CAPC, CONFIG.capAccuracy);
                }
            }
        }

        // ground turret: locks one target at a time (re-picks every 2s), tracks it, sprays fast + inaccurately
        if (FX.turret){
            const tu = FX.turret;
            const pool = [];                                       // everything EXCEPT the capital ship
            if (FX.squad){ const sq = FX.squad, t = sq.t;          // any squad member on stage, slotted or maneuvering
                for (const sh of sq.ships) if (!sh.dead && sh.wx !== undefined && t >= sh.arriveAt && t < sh.departAt + sh.depDur) pool.push(sh); }
            for (const tr of FX.transits) if (!tr.dead && tr.z > 2) pool.push(tr);
            if (tu.switchCool <= 0 || !tu.target || tu.target.dead){
                tu.target = pool.length ? pool[Math.random() * pool.length | 0] : null;
                tu.switchCool = CONFIG.turretSwitch;
            }
            const tg = tu.target;
            if (tg && !tg.dead){
                const gg = Math.min(12, tu.z);                     // match render scale (constant on-screen size)
                const apex = { x: tu.x, h: tu.h + 0.026 * gg, z: tu.z };  // barrel pivot atop the base
                const gx = tg.slot ? tg.wx : tg.x;                 // aim at the ship's live position
                const gh = tg.slot ? tg.wh : tg.h;
                const gz = tg.slot ? tg.wz : tg.z;
                const vx = tg.slot ? 0 : tg.ovx, vy = tg.slot ? 0 : tg.ovy, vz = tg.slot ? 0 : tg.ovz - gsB;
                tu.aim = leadAim(apex, gx, gh, gz, vx, vy, vz);     // barrel tracks the lead point
                const tinv = 1 / (Math.max(0.5, tu.z) * 0.6), tuvx = 0.5 + cam.headSend + tu.x * tinv / aspB;
                const onScreen = tuvx > 0.02 && tuvx < 0.98 && tu.z > 0.7;   // never fire while off-screen
                if (onScreen && tu.fireCool <= 0){
                    tu.fireCool = CONFIG.turretFireGap;
                    fireVolley(apex, 0.05, tu.aim, tg, 'enemy', CAPC, CONFIG.turretAccuracy);
                }
            }
        }
        // advance tracers; accuracy rolled AT IMPACT. ally bolts hurt transits/capital, enemy bolts kill fighters
        for (let i = FX.bolts.length - 1; i >= 0; i--){
            const b = FX.bolts[i];
            if (b.delay > 0){ b.delay -= dt; continue; }            // brief lock-on beat before launch
            b.age += dt;
            const u = b.T > 1e-3 ? b.age / b.T : 1;
            b.x = b.x0 + (b.tx - b.x0) * u; b.y = b.y0 + (b.ty - b.y0) * u; b.z = b.z0 + (b.tz - b.z0) * u;
            if (u >= 1 && !b.resolved){
                b.resolved = true;
                const tg = b.target;
                let hit = false;
                if (b.decisive && tg && !tg.dead && Math.random() < b.acc){
                    hit = true;
                    if (b.kind === 'enemy'){                         // capital/turret -> fighter or transit
                        tg.dead = true;
                        if (tg.slot) detonate(tg.wx, tg.wh, tg.wz, SHIP_MODELS[tg.model], 0, 0, 0, tg.scaleMul, 1, CY);
                        else detonate(tg.x, tg.h, tg.z, SHIP_MODELS[tg.model], tg.yaw, tg.pitch, tg.roll, tg.scaleMul, 1, CY);
                    } else if (tg.isTurret){                        // indestructible — sparks only
                        sparkBurst(b.x, b.y, b.z, 5);
                    } else if (tg.cap){                             // chip the capital's HP
                        sparkBurst(b.x, b.y, b.z, 6);
                        if (--tg.hp <= 0){
                            tg.dead = true;
                            detonate(tg.x, tg.h, tg.z, CAPITAL_MODEL, tg.yaw, tg.pitch, tg.roll, tg.scaleMul, 4, CAPC);
                            FX.capital = null; FX.nextCapital = rand(CONFIG.capitalGap[0], CONFIG.capitalGap[1]);
                        }
                    } else if (tg.isPoly){                          // tumbling polyhedron: big blast
                        tg.dead = true;
                        detonate(b.tx, b.ty, b.tz, OCTA_MODEL, tg.rx, tg.ry, 0, 1.6, 4, tg.col);
                    } else {                                        // transit
                        tg.dead = true;
                        detonate(tg.x, tg.h, tg.z, SHIP_MODELS[tg.model], tg.yaw, tg.pitch, tg.roll, tg.scaleMul, 1, CY);
                    }
                }
                if (hit){ FX.bolts.splice(i, 1); continue; }
                // a MISS: 1/3 glances off with a glow burst, 2/3 carries on past the ship
                if (Math.random() < 0.3333){ sparkBurst(b.x, b.y, b.z, 5); FX.bolts.splice(i, 1); continue; }
                // else keep flying (resolved prevents another roll); culled below when it leaves the field
            }
            if (b.z < 0.4 || b.z > 125) FX.bolts.splice(i, 1);   // reach the far (deep) transits before culling
        }
        for (let i = FX.blasts.length - 1; i >= 0; i--){ const bl = FX.blasts[i];
            bl.age += dt; if (bl.age >= bl.dur) FX.blasts.splice(i, 1); }

        // advance / retire
        const adv = (arr) => { for (let i = arr.length - 1; i >= 0; i--){ const o = arr[i];
            o.x += o.vx * dt; o.y += o.vy * dt; if (o.x < -0.2 || o.x > 1.2) arr.splice(i, 1); } };
        adv(FX.stars); adv(FX.comets); adv(FX.glyphs);
        for (let i = FX.polys.length - 1; i >= 0; i--){ const p = FX.polys[i];
            p.u += p.speed * dt; p.rx += p.wx * dt; p.ry += p.wy * dt; if (p.dead || p.u >= 1.15) FX.polys.splice(i, 1); }
        for (let i = FX.cycles.length - 1; i >= 0; i--){ const c = FX.cycles[i];
            c.u += c.speed * dt; if (c.u >= 1) FX.cycles.splice(i, 1); }

        // ridge fades in/out as an occasional "mode"
        if (FX.ridge) FX.ridge.scroll += dt * 0.01;
        FX.nextRidge -= dt;
        if (FX.nextRidge <= 0){ FX.ridgeTarget = Math.random() < CONFIG.ridgePresent ? 1 : 0; FX.nextRidge = rand(40, 90); }
        FX.ridgeAmt += (FX.ridgeTarget - FX.ridgeAmt) * (1 - Math.pow(0.5, dt / 3.0));

        // background depth: drift nebula clouds and near-stars (wrap in x)
        const wrap = v => ((v % 1) + 1) % 1;
        for (const nb of FX.nebula)    nb.x = wrap(nb.x + nb.drift * dt);
        for (const st of FX.nearStars) st.x = wrap(st.x + st.drift * dt);

        // distant lightning: an occasional quick jagged strike + sky flicker
        FX.nextLightning -= dt;
        if (FX.nextLightning <= 0){
            const x = rand(0.2, 0.8), segs = [], n = 6 + (Math.random() * 4 | 0);
            let yy = rand(0.06, 0.18), xx = x;
            for (let k = 0; k <= n; k++){ segs.push({ x: xx, y: yy }); yy += (0.56 - yy) / (n - k + 1); xx += rand(-0.03, 0.03); }
            FX.lightning = { age: 0, dur: rand(0.35, 0.6), x, segs, flashes: 2 + (Math.random() * 2 | 0) };
            FX.nextLightning = rand(CONFIG.lightningGap[0], CONFIG.lightningGap[1]);
        }
        if (FX.lightning){ FX.lightning.age += dt; if (FX.lightning.age >= FX.lightning.dur) FX.lightning = null; }

        // capital-ship flyby (single instance; far, slow, can be destroyed)
        if (!FX.capital){ FX.nextCapital -= dt; if (FX.nextCapital <= 0) FX.capital = makeCapital(); }
        else if (!FX.capital.dead){
            const c = FX.capital;
            c.x += c.ovx * dt; c.z += c.ovz * dt; c.h += c.ovy * dt; c.lights += dt;
            if (c.fireCool > 0) c.fireCool -= dt;
            if (c.backCool > 0) c.backCool -= dt;
            const inv = 1 / (Math.max(0.5, c.z) * 0.6), uvx = 0.5 + cam.headSend + c.x * inv / (sw / sh);
            c.onScreen = uvx > 0.03 && uvx < 0.97;              // gate its fire to when the user can see it
            if (uvx < -0.9 || uvx > 1.9){ FX.capital = null; FX.nextCapital = rand(CONFIG.capitalGap[0], CONFIG.capitalGap[1]); }
        }

        // ground turret: rides the grid toward the camera, then retires once it sweeps past
        if (!FX.turret){ FX.nextTurret -= dt; if (FX.nextTurret <= 0) FX.turret = makeTurret(); }
        else {
            const tu = FX.turret;
            tu.z -= (reduced ? 0 : CONFIG.gridScroll) * dt;     // tracks with the grid
            if (tu.switchCool > 0) tu.switchCool -= dt;
            if (tu.fireCool > 0) tu.fireCool -= dt;
            if (tu.shotCool > 0) tu.shotCool -= dt;             // formation's re-fire timer against it
            if (tu.z < 0.55){ FX.turret = null; FX.nextTurret = rand(CONFIG.turretGap[0], CONFIG.turretGap[1]); }
        }

        // falling embers from detonations — arc out, fall under gravity, spark on the grid floor
        const GRAV = 1.5, gs2 = reduced ? 0 : CONFIG.gridScroll;
        for (let i = FX.embers.length - 1; i >= 0; i--){ const e = FX.embers[i];
            e.vy -= GRAV * dt;
            e.x += e.vx * dt; e.z += (e.vz - gs2) * dt; e.y += e.vy * dt; e.life -= dt;
            if (e.y <= 0){ FX.groundSparks.push({ x: e.x, z: e.z, age: 0, dur: rand(0.35, 0.6) }); FX.embers.splice(i, 1); }
            else if (e.life <= 0 || e.z < 0.3 || e.z > 40) FX.embers.splice(i, 1);   // low cull so close (squad) deaths still spark the floor
        }
        if (FX.embers.length > 150) FX.embers.splice(0, FX.embers.length - 150);
        for (let i = FX.groundSparks.length - 1; i >= 0; i--){ const g = FX.groundSparks[i];
            g.age += dt; if (g.age >= g.dur) FX.groundSparks.splice(i, 1); }
    }

    function makeCapital(){
        // same randomized-trajectory recipe as the transit ships (heading deviation + slight climb)
        const dir = Math.random() < 0.5 ? 1 : -1, z = rand(16, 28);
        const span = z * 0.6 * (sw / sh) * 1.2;
        const sp = rand(0.25, 0.55), dev = rand(-0.3, 0.3);           // 50% of the old cruise speed
        const ang = (dir > 0 ? Math.PI / 2 : -Math.PI / 2) - dir * dev;
        const ovx = Math.sin(ang) * sp, ovz = Math.cos(ang) * sp * 0.3;
        const theta = rand(-2, 12) * Math.PI / 180;                   // gentle climb (little/no descent)
        const ovy = (Math.abs(ovx) / (sw / sh)) * Math.tan(theta);
        const vmag = Math.hypot(ovx, ovy, ovz) || 1;
        const scaleMul = rand(5.0, 8.0) * 1.3;                        // 1.3x bigger
        const Sxy = CONFIG.shipScale * scaleMul;
        const h = 0.4 * Sxy + rand(0.2, 0.7);                         // lift it so the whole hull is above the horizon
        return { x: dir > 0 ? -span : span, z, h, dir, ovx, ovz, ovy, cap: true,
            yaw: Math.atan2(ovx, Math.abs(ovz) < 1e-3 ? 1e-3 : ovz),
            pitch: -Math.asin(ovy / vmag), roll: -dir * rand(0.05, 0.16),
            scaleMul, lights: 0,
            hp: Math.round(rand(CONFIG.capHP[0], CONFIG.capHP[1])), dead: false, fireCool: 0, backCool: 1.0, onScreen: false };
    }

    // spawn a detonation: hull shards + shrapnel + falling embers, scaled by `mag` (1 = fighter, big = capital)
    function detonate(x, y, z, M, yaw, pitch, roll, scaleMul, mag, col){
        const sq = Math.sqrt(mag), debris = [], nd = Math.round((22 + (Math.random() * 12 | 0)) * mag);
        for (let k = 0; k < nd; k++){
            const th = Math.random() * 6.2832, cphi = 2 * Math.random() - 1, sphi = Math.sqrt(1 - cphi * cphi);
            debris.push({ dx: sphi * Math.cos(th), dy: cphi, dz: sphi * Math.sin(th), sp: rand(1.4, 4.6) * sq });
        }
        FX.blasts.push({ x, y, z, model: M, yaw, pitch, roll, scaleMul, age: 0, dur: 1.1 * sq, debris, col, mag });
        const ne = Math.round((10 + (Math.random() * 8 | 0)) * mag);
        for (let k = 0; k < ne; k++){
            const th = Math.random() * 6.2832, cphi = rand(-0.1, 0.8), sphi = Math.sqrt(Math.max(0, 1 - cphi * cphi));
            const spd = rand(1.2, 3.4) * sq, lifeT = rand(1.4, 2.6) * Math.min(2, sq);
            FX.embers.push({ x, y, z, vx: sphi*Math.cos(th)*spd, vy: cphi*spd*0.7 + rand(0.3,0.9)*sq, vz: sphi*Math.sin(th)*spd, life: lifeT, max: lifeT });
        }
    }

    // small non-fatal hit sparks (e.g. shells chipping the capital's hull)
    function sparkBurst(x, y, z, n){
        for (let k = 0; k < n; k++){
            const th = Math.random() * 6.2832, cphi = 2 * Math.random() - 1, sphi = Math.sqrt(1 - cphi * cphi);
            const spd = rand(1.0, 2.8), lifeT = rand(0.5, 1.1);
            FX.embers.push({ x, y, z, vx: sphi*Math.cos(th)*spd, vy: cphi*spd*0.5 + rand(0.2,0.6), vz: sphi*Math.sin(th)*spd, life: lifeT, max: lifeT });
        }
    }

    // lead-prediction intercept point ({x,h,z}) for a target moving at (vx,vy,vz) from a muzzle `from`
    function leadAim(from, tx, ty, tz, vx, vy, vz){
        let T = 0.3;
        for (let k = 0; k < 3; k++){
            const px = tx + vx*T, py = ty + vy*T, pz = tz + vz*T;
            T = Math.hypot(px - from.x, py - from.h, pz - from.z) / CONFIG.boltSpeed;
        }
        return { x: tx + vx*T, h: ty + vy*T, z: tz + vz*T };
    }
    // twin tracers from a muzzle `from` to an `aim` point; only the first rolls the kill at impact (prob `acc`)
    function fireVolley(from, muzOff, aim, target, kind, col, acc){
        const T = Math.max(0.05, Math.hypot(aim.x - from.x, aim.h - from.h, aim.z - from.z) / CONFIG.boltSpeed);
        let primary = true;
        for (const sgn of [-1, 1]){
            const ox = from.x + sgn * muzOff;
            FX.bolts.push({ x0: ox, y0: from.h, z0: from.z, x: ox, y: from.h, z: from.z,
                tx: aim.x, ty: aim.h, tz: aim.z, T, age: 0, delay: CONFIG.blastReact, target, decisive: primary, kind, col, acc });
            primary = false;
        }
    }

    // project a world point (lateral xw, forward z, height above grid) to clip space,
    // sharing the grid's perspective, fixed heading, and horizon (used by the squadron)
    function projectWorld(xw, z, hgt, aspect){
        const zc = Math.max(0.5, z);
        const inv = 1.0 / (zc * 0.6);
        const uvx = 0.5 + cam.headSend + xw * inv / aspect;
        const uvy = (CONFIG.horizon + cam.pitchSend) - 0.20 / zc + hgt * inv;   // y-up
        return { x: cx(uvx), y: cy(1 - uvy), inv };
    }

    // squadron: lead anchor trajectory (APPROACH -> CRUISE -> PEEL/EXIT)
    function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

    // each wingman arrives and departs independently (one at a time, random stagger);
    // the formation holds 10s after the LAST ship arrives, then they peel off one by one.
    function makeSquad(){
        const dir = Math.random() < 0.5 ? 1 : -1, baseZ = 1.4, aspB = sw / sh;
        // centre the formation so the lead always fits, allowing for the off-centre vanishing point + aspect
        const leadInv = 1 / (baseZ * 0.6);
        const xw0 = rand(-1, 1) * Math.max(0, (0.30 - Math.abs(cam.headSend)) * aspB / leadInv);
        const allSlots = [
            { dxw: 0.0, dz: 0.0,  dh: 0.0,  ps: dir, lead: 1 }, // lead (apex, farthest)
            { dxw:-0.45,dz:-0.30, dh:-0.03, ps: -1,  lead: 0 },
            { dxw: 0.45,dz:-0.30, dh:-0.03, ps:  1,  lead: 0 },
            { dxw:-0.85,dz:-0.60, dh:-0.05, ps: -1,  lead: 0 },
            { dxw: 0.85,dz:-0.60, dh:-0.05, ps:  1,  lead: 0 },
        ];
        // a slot may join only if its hold position sits on screen — narrow screens fit fewer wingmen
        const fits = s => {
            const inv = 1 / ((baseZ + s.dz) * 0.6);
            const uvx = 0.5 + cam.headSend + (xw0 + s.dxw) * inv / aspB;
            return uvx > 0.05 && uvx < 0.95;
        };
        const wings = allSlots.slice(1).filter(fits);
        const slots = [allSlots[0], ...wings.slice(0, Math.min(wings.length, 1 + (Math.random() * 4 | 0)))];
        const n = slots.length, ARR_DUR = 7.0, DEP_DUR = 15.0, HOLD = 10.0;
        // staggered arrivals, random order, random gaps (one at a time)
        const arriveAt = new Array(n); let clk = rand(0.5, 1.5);
        for (const idx of shuffle([...Array(n).keys()])){ arriveAt[idx] = clk; clk += rand(2.5, 5.5); }
        let lastArrEnd = 0;
        for (let i = 0; i < n; i++) lastArrEnd = Math.max(lastArrEnd, arriveAt[i] + ARR_DUR);
        // depart 10s after everyone has arrived; staggered, different random order
        const departAt = new Array(n); clk = lastArrEnd + HOLD;
        for (const idx of shuffle([...Array(n).keys()])){ departAt[idx] = clk; clk += rand(2.5, 5.5); }
        let endT = 0;
        for (let i = 0; i < n; i++) endT = Math.max(endT, departAt[i] + DEP_DUR);
        const ships = slots.map((s, i) => {
            // random arrival vector (offset from the slot): sides / above / below / behind
            const ang = Math.random() * 6.283, reach = rand(2.2, 4.0);
            let edx = Math.cos(ang) * reach, edh = Math.sin(ang) * reach * 0.4, edz = -rand(0.6, 1.4);
            if (Math.random() < 0.4){ edx *= 0.2; edh *= 0.2; edz = -rand(1.1, 1.7); }  // straight from behind
            return {
                slot: s, lead: !!s.lead, phase: i * 1.3,
                model: Math.random() * SHIP_MODELS.length | 0,   // random ship variation
                col: s.lead ? CONFIG.col.hot : CONFIG.col.cyan,
                scaleMul: (s.lead ? 1.25 : 1.0) * rand(0.8, 1.2) * 0.33,  // ~2/3 of the sun's radius at most, +/-20% variation
                arriveAt: arriveAt[i], arrDur: ARR_DUR, departAt: departAt[i], depDur: DEP_DUR,
                edx, edz, edh, hVar: rand(-0.05, 0.05),   // per-ship hold-height variation
                fireCool: Math.random() * CONFIG.blastCooldown,   // desynced so they don't volley in lockstep
            };
        });
        return { t: 0, dir, xw0, baseZ, ships, endT };
    }

    // invert the grid's perspective so floor cameos sit on the moving grid plane
    function groundToClip(xw, z, aspect){
        const depth = 0.20 / z - 0.0008;
        const H0 = CONFIG.horizon + cam.pitchSend;
        const uvy = H0 - depth;
        const uvx = 0.5 + cam.headSend + xw / (aspect * z * 0.6);
        return { x: cx(uvx), y: cy(1 - uvy), vis: uvy > 0.0 && uvy < H0 };  // note: cy expects y-down
    }

    function buildFX(timeSec, bg){    // bg=true builds only the behind-the-sun layer (nebula, stars, ridge)
        const dprNow = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
        const aspect = sw / sh;
        let li = 0, pi = 0, ti = 0, ti2 = 0;
        // helpers (clip-space in; y already clip for lines, normalized-down for pt via cx/cy at call sites)
        // translucent filled triangle (clip-space verts, per-vertex brightness scales the color)
        const pushTriClip = (x0, y0, x1, y1, x2, y2, b, c) => {
            if (ti + 18 > FX_TRI_FLOATS) return;
            fxTriData[ti++] = x0; fxTriData[ti++] = y0; fxTriData[ti++] = b;
            fxTriData[ti++] = c[0]*b; fxTriData[ti++] = c[1]*b; fxTriData[ti++] = c[2]*b;
            fxTriData[ti++] = x1; fxTriData[ti++] = y1; fxTriData[ti++] = b;
            fxTriData[ti++] = c[0]*b; fxTriData[ti++] = c[1]*b; fxTriData[ti++] = c[2]*b;
            fxTriData[ti++] = x2; fxTriData[ti++] = y2; fxTriData[ti++] = b;
            fxTriData[ti++] = c[0]*b; fxTriData[ti++] = c[1]*b; fxTriData[ti++] = c[2]*b;
        };
        // 2nd fill buffer (additive neon-glass glow, drawn after the multiply darken pass)
        const pushTri2Clip = (x0, y0, x1, y1, x2, y2, b, c) => {
            if (ti2 + 18 > FX_TRI_FLOATS) return;
            fxTri2Data[ti2++] = x0; fxTri2Data[ti2++] = y0; fxTri2Data[ti2++] = b;
            fxTri2Data[ti2++] = c[0]*b; fxTri2Data[ti2++] = c[1]*b; fxTri2Data[ti2++] = c[2]*b;
            fxTri2Data[ti2++] = x1; fxTri2Data[ti2++] = y1; fxTri2Data[ti2++] = b;
            fxTri2Data[ti2++] = c[0]*b; fxTri2Data[ti2++] = c[1]*b; fxTri2Data[ti2++] = c[2]*b;
            fxTri2Data[ti2++] = x2; fxTri2Data[ti2++] = y2; fxTri2Data[ti2++] = b;
            fxTri2Data[ti2++] = c[0]*b; fxTri2Data[ti2++] = c[1]*b; fxTri2Data[ti2++] = c[2]*b;
        };
        const pushLineClip = (x0, y0, x1, y1, b, c) => {
            if (li + 12 > FX_LINE_FLOATS) return;
            fxLineData[li++] = x0; fxLineData[li++] = y0; fxLineData[li++] = b;
            fxLineData[li++] = c[0]*b; fxLineData[li++] = c[1]*b; fxLineData[li++] = c[2]*b;
            fxLineData[li++] = x1; fxLineData[li++] = y1; fxLineData[li++] = b;
            fxLineData[li++] = c[0]*b; fxLineData[li++] = c[1]*b; fxLineData[li++] = c[2]*b;
        };
        // normalized (y-down) line helper
        const pushLineN = (nx0, ny0, nx1, ny1, b, c) => pushLineClip(cx(nx0), cy(ny0), cx(nx1), cy(ny1), b, c);
        const pushPt = (nx, ny, size, r, g, b) => {
            if (pi + 6 > FX_PT_FLOATS) return;
            fxPtData[pi++] = cx(nx); fxPtData[pi++] = cy(ny); fxPtData[pi++] = size;
            fxPtData[pi++] = r; fxPtData[pi++] = g; fxPtData[pi++] = b;
        };
        const HOT = CONFIG.col.hot, CYAN = CONFIG.col.cyan, MAG = CONFIG.col.magenta, WHITE = [1, 1, 1];
        const wrap1 = v => ((v % 1) + 1) % 1;

      if (bg){   // ───── behind-the-sun background layer (nebula, near-stars, ridge) ─────
        // --- background depth: soft parallax nebula clouds + a drifting near-star layer ---
        for (const nb of FX.nebula){
            const px = wrap1(nb.x + cam.headSend * (0.02 + nb.depth * 0.05));
            for (const bl of nb.blobs){
                const x = px + bl.dx;                            // draw at x and x-1 for a seamless wrap
                pushPt(x,     nb.y + bl.dy, bl.sz * dprNow, nb.col[0]*nb.br, nb.col[1]*nb.br, nb.col[2]*nb.br);
                pushPt(x - 1, nb.y + bl.dy, bl.sz * dprNow, nb.col[0]*nb.br, nb.col[1]*nb.br, nb.col[2]*nb.br);
            }
        }
        for (const st of FX.nearStars){
            const tw = st.mag * (0.45 + 0.55 * Math.sin(timeSec * st.rate + st.ph));
            if (tw <= 0.02) continue;
            const px = wrap1(st.x + cam.headSend * (0.04 + st.depth * 0.10));
            pushPt(px, st.y, (1.4 + 1.8 * st.depth) * dprNow, st.col[0]*tw, st.col[1]*tw, st.col[2]*tw);
        }

        // --- distant ridge (taller, glowing mountain mass + bright ridgeline) ---
        if (FX.ridge && FX.ridgeAmt > 0.01){
            const R = FX.ridge, SEG = R.pts.length - 1, base = R.scroll + cam.headSend * 0.04;
            const c = CONFIG.col.purple, amt = FX.ridgeAmt, b = 0.226 * amt, fb = 0.34 * amt;   // crest line dimmed to 2/3
            const hz = (1 - CONFIG.horizon) - cam.pitchSend;     // horizon line (y-down)
            const seg = (sx0, sy0, sx1, sy1) => {                // one ridge span: filled body + crest line
                pushTriClip(cx(sx0), cy(sy0), cx(sx1), cy(sy1), cx(sx1), cy(hz), fb, c);
                pushTriClip(cx(sx0), cy(sy0), cx(sx1), cy(hz), cx(sx0), cy(hz), fb, c);
                pushLineClip(cx(sx0), cy(sy0), cx(sx1), cy(sy1), b, c);
            };
            for (let i = 0; i < SEG; i++){
                let x0 = ((((i / SEG) * R.span - base) % 1) + 1) % 1;
                let x1 = (((((i + 1) / SEG) * R.span - base) % 1) + 1) % 1;
                const y0 = R.pts[i] - cam.pitchSend, y1 = R.pts[i + 1] - cam.pitchSend;
                if (Math.abs(x1 - x0) > 0.5){                // wrap seam: draw BOTH edge pieces (GL clips them) so no gap
                    if (x0 > x1){ seg(x0, y0, x1 + 1, y1); seg(x0 - 1, y0, x1, y1); }
                    else        { seg(x0, y0, x1 - 1, y1); seg(x0 + 1, y0, x1, y1); }
                } else {
                    seg(x0, y0, x1, y1);
                }
            }
        }
        return { lineVerts: li / 6, ptVerts: pi / 6, triVerts: ti / 6, tri2Verts: ti2 / 6, lineFloats: li, ptFloats: pi, triFloats: ti, tri2Floats: ti2 };
      }   // ───── end background layer; everything below is the in-front layer ─────

        // --- distant lightning: a quick jagged strike + brief sky flicker ---
        if (FX.lightning){
            const L = FX.lightning, p = L.age / L.dur;
            const strobe = Math.abs(Math.sin(p * Math.PI * L.flashes));
            const b = (1 - p) * strobe;
            if (b > 0.03){
                for (let k = 0; k < L.segs.length - 1; k++)
                    pushLineN(L.segs[k].x, L.segs[k].y, L.segs[k+1].x, L.segs[k+1].y, 1.3 * b, HOT);
                for (let k = 0; k < 5; k++)
                    pushPt(L.x + (k/4 - 0.5) * 0.3, 0.1 + 0.06 * k, 95 * dprNow, 0.10*b, 0.10*b, 0.17*b);
            }
        }

        // --- shooting stars + comet (sky point-trails) ---
        const drawTrail = (o, headSize, trailN, spacing, mul) => {
            const dl = Math.hypot(o.vx, o.vy) || 1, ux = -o.vx / dl, uy = -o.vy / dl;
            const px = o.x + cam.headSend * (0.04 + o.depth * 0.10);
            for (let k = 0; k < trailN; k++){
                const f = 1 - k / trailN, br = f * f;
                const sz = (k === 0 ? headSize : headSize * 0.55 * f) * dprNow;
                const cc = o.col || CONFIG.col.hot;
                pushPt(px + ux * spacing * k, o.y + uy * spacing * k, sz,
                       cc[0] * br * mul, cc[1] * br * mul, cc[2] * br * mul);
            }
        };
        for (const s of FX.stars)  drawTrail(s, 7, 8, 0.012, 1.4);
        for (const c of FX.comets){            // two-tone: orange core fading toward magenta tail
            const dl = Math.hypot(c.vx, c.vy) || 1, ux = -c.vx / dl, uy = -c.vy / dl;
            const px = c.x + cam.headSend * (0.04 + c.depth * 0.10), O = CONFIG.col.orange, M = CONFIG.col.magenta;
            for (let k = 0; k < 14; k++){
                const f = 1 - k / 14, br = f * f, mixm = k / 14;
                const sz = (k === 0 ? 11 : 6 * f) * dprNow;
                pushPt(px + ux * 0.014 * k, c.y + uy * 0.014 * k, sz,
                       (O[0]+(M[0]-O[0])*mixm)*br*1.4, (O[1]+(M[1]-O[1])*mixm)*br*1.4, (O[2]+(M[2]-O[2])*mixm)*br*1.4);
            }
        }

        // --- tumbling wireframe polyhedra (mid, glowing edges) ---
        for (const p of FX.polys){
            if (p.dead) continue;
            const path = p.dir > 0 ? (-0.2 + 1.4 * p.u) : (1.2 - 1.4 * p.u);
            const ox = path + cam.headSend * (0.04 + p.depth * 0.10), oy = p.y;
            const cxr = Math.cos(p.rx), sxr = Math.sin(p.rx), cyr = Math.cos(p.ry), syr = Math.sin(p.ry);
            const edge = Math.min(1, (1 - Math.abs(p.u - 0.5) * 2) * 4);
            const proj = v => {
                let x = cyr * v[0] + syr * v[2], z = -syr * v[0] + cyr * v[2];
                let y = cxr * v[1] - sxr * z; z = sxr * v[1] + cxr * z;
                const s = p.scale / (1.6 - 0.4 * z);
                return [ox + x * s / aspect, oy + y * s];
            };
            const b = 0.9 * edge;
            for (const [a, bb] of OCTA_E){ const A = proj(OCTA_V[a]), B = proj(OCTA_V[bb]);
                pushLineN(A[0], A[1], B[0], B[1], b, p.col); }
        }

        // --- light-cycle grid streaks (on the floor, perspective-correct) ---
        for (const c of FX.cycles){
            const span = c.z * 0.6 * aspect;
            const headW = c.dir > 0 ? (-span + 2 * span * c.u) : (span - 2 * span * c.u);
            const TR = 10, step = span * 0.05; let prev = null;
            for (let k = 0; k < TR; k++){
                const xw = headW - c.dir * step * k - cam.headSend * 0.5;
                const g = groundToClip(xw, c.z, aspect);
                if (!g.vis){ prev = null; continue; }
                const f = 1 - k / TR, b = (k === 0 ? 1.2 : 0.8 * f);
                if (prev) pushLineClip(prev.x, prev.y, g.x, g.y, b, c.col);
                prev = g;
            }
        }

        // --- glyph clusters (faint ambient marks) ---
        for (const gc of FX.glyphs){
            const px = gc.x + cam.headSend * 0.12;
            for (const m of gc.marks){
                const tw = 0.25 + 0.15 * Math.sin(timeSec * 3.0 + m.ph);   // low-key flicker
                const c = gc.col;
                pushPt(px + m.dx, gc.y + m.dy, 2.2 * dprNow, c[0]*tw, c[1]*tw, c[2]*tw);
            }
        }

        // --- Star Fox wingmate squadron: true low-poly 3D, banks/turns over the grid ---
        // each vertex is a real world point (lateral xw, forward z, height h), so the ship
        // foreshortens and re-orients in 3D as it rolls/yaws/pitches.
        const drawShip = (xw, z, h, roll, yaw, pitch, scaleMul, col, fade, lead, M, plume = 1, travel = null) => {
            const Sxy = CONFIG.shipScale * scaleMul, Sz = Sxy * 0.6;
            const cr = Math.cos(roll), sr = Math.sin(roll);
            const cyw = Math.cos(yaw), syw = Math.sin(yaw);
            const cp = Math.cos(pitch), sp = Math.sin(pitch);
            const rot = v => {                                   // roll(z) -> pitch(x) -> yaw(y)
                let x = v[0]*cr - v[1]*sr, y = v[0]*sr + v[1]*cr, zz = v[2];
                const y2 = y*cp - zz*sp;   zz =  y*sp + zz*cp;   y = y2;
                const x2 = x*cyw + zz*syw; zz = -x*syw + zz*cyw; x = x2;
                return [x, y, zz];
            };
            const proj = v => {
                const r = rot(v);
                const wz = z + r[2] * Sz;
                const C = projectWorld(xw + r[0] * Sxy, wz, h + r[1] * Sxy, aspect);
                return { x: C.x, y: C.y, wz, inv: C.inv };
            };
            const P = M.V.map(proj);
            const nf = wz => Math.max(0.45, Math.min(1.1, 0.85 + (z - wz) * 2.2));  // near=bright, far=dim
            const baseB = (lead ? 1.05 : 0.8) * fade;
            // two-pass hull fill: a MULTIPLY darken (silhouettes the bright sun, negligible over the dark sky)
            // plus an ADDITIVE neon-glass glow on top (the volume you see over the sky); edges draw over both.
            if (M.F && CONFIG.shipFill > 0){
                for (const [a, b, c2] of M.F){
                    const nfa = (nf(P[a].wz) + nf(P[b].wz) + nf(P[c2].wz)) / 3;
                    const op = Math.min(0.4, CONFIG.shipFill * 1.3 * fade * nfa);     // darken (multiply pass)
                    pushTriClip(P[a].x, P[a].y, P[b].x, P[b].y, P[c2].x, P[c2].y, Math.sqrt(1 - op), WHITE);
                    pushTri2Clip(P[a].x, P[a].y, P[b].x, P[b].y, P[c2].x, P[c2].y, CONFIG.shipFill * fade * nfa, col);  // glow
                }
            }
            for (const [a, b] of M.E)
                pushLineClip(P[a].x, P[a].y, P[b].x, P[b].y, baseB * 0.5 * (nf(P[a].wz) + nf(P[b].wz)), col);
            // twin engine glow (white-hot core; blooms) + short cyan afterburner trail
            const H = CONFIG.col.hot, Cc = CONFIG.col.cyan;
            const eb = 1.5 * fade * plume * (0.85 + 0.15 * Math.sin(timeSec * 30 + xw * 7));
            for (const e of M.ENG){ const pe = proj(e);
                const esz = Math.max(3, Math.min(22, pe.inv * Sxy * 230 * plume)) * dprNow;
                pushPt((pe.x + 1) * 0.5, (1 - pe.y) * 0.5, esz, H[0]*eb, H[1]*eb, H[2]*eb); }
            // long twin afterburner trails — extend straight back along the ship's WORLD
            // flight PATH (true 3D) so they foreshorten with our perspective like the grid.
            // Default to opposite the nose, but when the caller knows the ship's velocity
            // (squadron arrival/peel-off, where the nose is eased off the heading for style)
            // trail along -velocity instead, so the plume points where the ship came from.
            const fwd = rot([0, 0, 1]);                      // nose direction (local +z) in world
            let bx = -fwd[0], by = -fwd[1], bz = -fwd[2];    // trail dir = opposite nose (out the tail)
            if (travel){
                const tl = Math.hypot(travel[0], travel[1], travel[2]);
                if (tl > 1e-4){ bx = -travel[0] / tl; by = -travel[1] / tl; bz = -travel[2] / tl; }
            }
            const TR = 12, segZ = 0.05, segL = 0.04;
            for (const e of M.ENG){
                const er = rot(e);
                const ex = xw + er[0] * Sxy, ez = z + er[2] * Sz, eh = h + er[1] * Sxy;   // engine world pos
                for (let k = 1; k <= TR; k++){
                    const T = projectWorld(ex + bx * segL * k, ez + bz * segZ * k, eh + by * segL * k, aspect);
                    const f = 1 - k / (TR + 1), tb = f * f * 1.3 * fade * plume, mix = k / TR;
                    pushPt((T.x + 1) * 0.5, (1 - T.y) * 0.5, Math.min(20, T.inv * Sxy * 150 * plume) * f * dprNow,
                           (H[0]+(Cc[0]-H[0])*mix)*tb, (H[1]+(Cc[1]-H[1])*mix)*tb, (H[2]+(Cc[2]-H[2])*mix)*tb);
                }
            }
        };
        if (FX.squad){
            const sq = FX.squad, t = sq.t;
            for (const sh of sq.ships){
                if (t < sh.arriveAt || sh.dead) continue;                        // not on stage yet, or shot down
                const s = sh.slot;
                const slotXw = sq.xw0 + s.dxw, slotZ = sq.baseZ + s.dz, slotH = CONFIG.shipHeight + s.dh + sh.hVar;
                let xw, z, h, roll = 0, yaw = 0, pitch = 0, fade, travel = null;
                // nose ALWAYS points along the flight path: derive yaw/pitch from the same `travel`
                // vector the plume uses, so the body, its motion and the jet can never disagree.
                const aimAlong = T => {                                          // T = world velocity dir
                    const tl = Math.hypot(T[0], T[2]) || 1e-3;
                    yaw = Math.atan2(T[0], T[2]); pitch = -Math.atan2(T[1], tl);
                };
                if (t < sh.arriveAt + sh.arrDur){                                // ARRIVING (from a random direction)
                    const p = (t - sh.arriveAt) / sh.arrDur, e = easeOut(p), ie = 1 - e;
                    xw = slotXw + sh.edx * ie; z = Math.max(0.35, slotZ + sh.edz * ie); h = slotH + sh.edh * ie;
                    fade = Math.min(1, p / 0.2);
                    // entry velocity, easing to formation-forward as it settles into the slot
                    const aMag = Math.hypot(sh.edx, sh.edh, sh.edz) || 1;
                    travel = [-sh.edx * ie, -sh.edh * ie, -sh.edz * ie + (1 - ie) * aMag];
                    aimAlong(travel);
                    roll = -yaw * 0.4;                                           // gentle bank into the curve
                } else if (t < sh.departAt){                                     // HOLD formation (alive)
                    xw = slotXw; z = slotZ; h = slotH; fade = 1;
                    const w = Math.min(1, (t - (sh.arriveAt + sh.arrDur)) / 2.0); // ease wobble in (no snap)
                    roll = w * 0.14 * Math.sin(t * 0.53 + sh.phase);             // 1/3 of the prior rate
                    pitch = w * 0.05 * Math.sin(t * 0.37 + sh.phase * 1.3);      // nose forward (yaw 0) + soft bob
                } else {                                                         // DEPARTING (15s peel-off)
                    const p = Math.min(1, (t - sh.departAt) / sh.depDur), peel = easeIn(p);
                    const wob = Math.max(0, 1 - p / 0.2);                        // carry hold wobble out smoothly
                    const vUp = (sh.lead ? 0.5 : 0.0) + 0.55;                    // climb-out rate (steeper for lead)
                    xw = slotXw + sq.dir * s.ps * CONFIG.peelSpread * peel;
                    z  = slotZ + peel * 0.8;
                    h  = slotH + vUp * peel;
                    fade  = 1 - Math.min(1, Math.max(0, (p - 0.85) / 0.15));
                    // peel-off velocity (lateral + away + climb), eased out of straight-forward
                    travel = [sq.dir * s.ps * CONFIG.peelSpread * peel, vUp * peel, 0.8 * peel + (1 - peel)];
                    aimAlong(travel);
                    roll = wob * 0.14 * Math.sin(t * 0.53 + sh.phase) + sq.dir * s.ps * CONFIG.shipMaxRoll * peel;
                }
                sh.wx = xw; sh.wz = z; sh.wh = h;                                // live pos for the combat code
                if (fade <= 0.001) continue;
                drawShip(xw, z, h, roll, yaw, pitch, sh.scaleMul, sh.col, fade, sh.lead, SHIP_MODELS[sh.model], 1, travel);
            }
        }
        // distant transit ships (nose along their own heading; fade out as they pass near)
        for (const tr of FX.transits){
            if (tr.dead) continue;                              // destroyed this frame — the blast stands in for it
            const fade = 0.95 * Math.min(1, (tr.z - 1.0) / 1.5);   // fade only when very close, so they can pass nearer
            if (fade <= 0.01) continue;
            drawShip(tr.x, tr.z, tr.h, tr.roll, tr.yaw, tr.pitch, tr.scaleMul, CONFIG.col.cyan, fade, false, SHIP_MODELS[tr.model], tr.plume);
        }

        // blaster tracers (bright streaks; ally = hot-core, enemy = ominous red, true-3D foreshortening)
        for (const b of FX.bolts){
            if (b.delay > 0) continue;                          // still in the lock-on beat
            if (b.z < 0.35) continue;
            const bc = b.col || HOT;
            const C = projectWorld(b.x, b.z, b.y, aspect);
            const dx = b.tx - b.x0, dy = b.ty - b.y0, dz = b.tz - b.z0, dl = Math.hypot(dx, dy, dz) || 1;
            const ux = dx / dl, uy = dy / dl, uz = dz / dl;
            // streak grows OUT of the muzzle: its length = how far the bolt has flown (capped), so at
            // firing it's a point on the ship, not a full tail hanging behind it. Also never cross the near plane.
            const flown = Math.hypot(b.x - b.x0, b.y - b.y0, b.z - b.z0);
            let tl = Math.min(0.7, flown);
            if (uz > 0) tl = Math.min(tl, Math.max(0, (b.z - 0.6) / uz));
            if (tl > 0.01){
                const Tt = projectWorld(b.x - ux * tl, b.z - uz * tl, b.y - uy * tl, aspect);
                pushLineClip(Tt.x, Tt.y, C.x, C.y, 1.1, bc);
            }
            pushPt((C.x + 1) * 0.5, (1 - C.y) * 0.5, Math.min(15, C.inv * 34) * dprNow,
                   bc[0] * 1.5, bc[1] * 1.5, bc[2] * 1.5);
            if (b.age < 0.10){                                  // muzzle flash anchored at the firing cannon
                const O = projectWorld(b.x0, b.z0, b.y0, aspect), ff = 1 - b.age / 0.10;
                pushPt((O.x + 1) * 0.5, (1 - O.y) * 0.5, (6 + 12 * ff) * dprNow, bc[0]*1.6*ff, bc[1]*1.6*ff, bc[2]*1.6*ff);
            }
        }

        // detonations: hull blown apart + omnidirectional shrapnel + white flash + double shockwave
        for (const bl of FX.blasts){
            const p = bl.age / bl.dur, fade = 1 - p, fade2 = fade * fade;
            const M = bl.model, mag = bl.mag || 1, sqm = Math.sqrt(mag), RC = bl.col || CYAN;
            const Sxy = CONFIG.shipScale * bl.scaleMul, Sz = Sxy * 0.6;
            const cr = Math.cos(bl.roll), sr = Math.sin(bl.roll);
            const cp = Math.cos(bl.pitch), sp = Math.sin(bl.pitch);
            const cyw = Math.cos(bl.yaw), syw = Math.sin(bl.yaw);
            const rot = v => {                                  // same roll(z)->pitch(x)->yaw(y) as drawShip
                let x = v[0]*cr - v[1]*sr, y = v[0]*sr + v[1]*cr, zz = v[2];
                const y2 = y*cp - zz*sp; zz = y*sp + zz*cp; y = y2;
                const x2 = x*cyw + zz*syw; zz = -x*syw + zz*cyw; x = x2;
                return [x, y, zz];
            };
            const ctr = projectWorld(bl.x, bl.z, bl.y, aspect);
            // hull shards fly far apart
            const boom = bl.age * 5.0;                          // shards hurled outward from the hull centre
            const P = M.V.map(v => {
                const r = rot(v), L = Math.hypot(r[0], r[1], r[2]) || 1, k = 1 + boom / L;
                return projectWorld(bl.x + r[0]*k*Sxy, bl.z + r[2]*k*Sz, bl.y + r[1]*k*Sxy, aspect);
            });
            const sb = 1.15 * fade;
            for (const [a, b2] of M.E) pushLineClip(P[a].x, P[a].y, P[b2].x, P[b2].y, sb, RC);
            // omnidirectional shrapnel (hot core cooling toward the blast colour as it scatters)
            for (const d of bl.debris){
                const dist = bl.age * d.sp;
                const Pd = projectWorld(bl.x + d.dx * dist, bl.z + d.dz * dist, bl.y + d.dy * dist, aspect);
                if (Pd.inv <= 0) continue;
                const sz = Math.min(13, Pd.inv * 46) * fade * dprNow * sqm;
                const mx = Math.min(1, p * 1.6), br = 1.5 * fade2;
                pushPt((Pd.x + 1) * 0.5, (1 - Pd.y) * 0.5, sz,
                       (HOT[0] + (RC[0]-HOT[0])*mx) * br, (HOT[1] + (RC[1]-HOT[1])*mx) * br,
                       (HOT[2] + (RC[2]-HOT[2])*mx) * br);
            }
            // bright central flash + lingering core glow (bigger for higher-mag blasts)
            const fl = Math.max(0, 1 - p / 0.30);
            if (fl > 0)
                pushPt((ctr.x + 1) * 0.5, (1 - ctr.y) * 0.5, (26 + 120 * fl) * sqm * dprNow,
                       HOT[0] * 2.2 * fl, HOT[1] * 2.2 * fl, HOT[2] * 2.2 * fl);
            pushPt((ctr.x + 1) * 0.5, (1 - ctr.y) * 0.5, (14 + 30 * fade) * sqm * dprNow,
                   HOT[0] * 1.1 * fade2, RC[1] * 0.6 * fade2, RC[2] * 0.9 * fade2);
            // double expanding shockwave ring (in the target plane), scaled by blast size
            for (let ri = 0; ri < 2; ri++){
                const ringN = 24, rr = bl.age * (ri ? 2.3 : 3.8) * sqm, rb = fade * (ri ? 0.7 : 1.0);
                for (let k = 0; k < ringN; k++){
                    const a = k / ringN * 6.2832;
                    const Pr = projectWorld(bl.x + Math.cos(a) * rr, bl.z, bl.y + Math.sin(a) * rr, aspect);
                    pushPt((Pr.x + 1) * 0.5, (1 - Pr.y) * 0.5, 7 * rb * dprNow,
                           RC[0] * rb, RC[1] * rb, RC[2] * rb);
                }
            }
        }

        // --- capital-ship flyby (huge translucent ominous dreadnought near the horizon) ---
        if (FX.capital && !FX.capital.dead){
            const c = FX.capital, M = CAPITAL_MODEL, OM = CONFIG.col.cap;
            const Sxy = CONFIG.shipScale * c.scaleMul, Sz = Sxy * 0.6;
            const cr = Math.cos(c.roll), sr = Math.sin(c.roll);
            const cp = Math.cos(c.pitch || 0), spp = Math.sin(c.pitch || 0);
            const cyw = Math.cos(c.yaw), syw = Math.sin(c.yaw);
            const rot = v => {                                                          // roll(z)->pitch(x)->yaw(y)
                let x = v[0]*cr - v[1]*sr, y = v[0]*sr + v[1]*cr, zz = v[2];
                const y2 = y*cp - zz*spp; zz = y*spp + zz*cp; y = y2;
                const x2 = x*cyw + zz*syw; zz = -x*syw + zz*cyw; x = x2; return [x, y, zz];
            };
            const proj = v => { const r = rot(v); return projectWorld(c.x + r[0]*Sxy, c.z + r[2]*Sz, c.h + r[1]*Sxy, aspect); };
            const cc = projectWorld(c.x, c.z, c.h, aspect), ux = (cc.x + 1) * 0.5;
            const fade = Math.min(1, Math.max(0, Math.min(ux + 0.35, 1.35 - ux) / 0.3));   // ease on/off at the sides
            if (fade > 0.01){
                const P = M.V.map(proj);
                const cop = Math.min(0.4, CONFIG.shipFill * 0.85 * 1.3 * fade);   // multiply darken (silhouettes the sun)
                const cglow = CONFIG.shipFill * 0.85 * fade;                       // additive glow
                for (const [a, b2, c2] of M.F){
                    pushTriClip(P[a].x, P[a].y, P[b2].x, P[b2].y, P[c2].x, P[c2].y, Math.sqrt(1 - cop), WHITE);
                    pushTri2Clip(P[a].x, P[a].y, P[b2].x, P[b2].y, P[c2].x, P[c2].y, cglow, OM);
                }
                for (const [a, b2] of M.E) pushLineClip(P[a].x, P[a].y, P[b2].x, P[b2].y, 0.7 * fade, OM);
                for (let k = 0; k < M.LIGHTS.length; k++){                                  // blinking running lights
                    const pp = P[M.LIGHTS[k]], bl = 0.5 + 0.5 * Math.sin(c.lights * 3 + k * 1.7), col = (k % 2) ? OM : CONFIG.col.orange;
                    pushPt((pp.x + 1) * 0.5, (1 - pp.y) * 0.5, (3 + 3 * bl) * dprNow, col[0]*bl*fade, col[1]*bl*fade, col[2]*bl*fade);
                }
                // big, long exhaust jets — true-3D plume extending back along the world heading
                const fwd = rot([0, 0, 1]), TR = 18, segL = 0.16, segZ = 0.20;
                for (const e of M.ENG){
                    const pe = proj(e);                                                    // bright engine core
                    pushPt((pe.x + 1) * 0.5, (1 - pe.y) * 0.5, Math.min(26, pe.inv * Sxy * 150) * dprNow,
                           HOT[0]*1.2*fade, HOT[1]*0.55*fade, OM[2]*0.6*fade);
                    const er = rot(e), ex = c.x + er[0]*Sxy, ez = c.z + er[2]*Sz, eh = c.h + er[1]*Sxy;
                    for (let kk = 1; kk <= TR; kk++){
                        const T = projectWorld(ex - fwd[0]*segL*kk, ez - fwd[2]*segZ*kk, eh - fwd[1]*segL*kk, aspect);
                        const f = 1 - kk / (TR + 1), tb = f * f * 1.5 * fade, mix = kk / TR;
                        pushPt((T.x + 1) * 0.5, (1 - T.y) * 0.5, Math.min(26, T.inv * Sxy * 130) * f * dprNow,
                               (HOT[0]+(OM[0]-HOT[0])*mix)*tb, (HOT[1]+(OM[1]-HOT[1])*mix)*tb, (HOT[2]+(OM[2]-HOT[2])*mix)*tb);
                    }
                }
            }
        }

        // --- ground turret: small ominous emplacement on the grid; barrel tracks its target ---
        if (FX.turret){
            const tu = FX.turret, OM = CONFIG.col.cap;
            const fade = Math.min(1, Math.max(0, (tu.z - 0.55) / 0.5));     // stay visible nearly to the bottom
            // world size ~proportional to z so the on-screen size stays small and CONSTANT the whole ride
            const g = Math.min(12, tu.z);
            const sB = 0.018 * g, baseH = 0.026 * g, barrelLen = 0.05 * g;
            if (fade > 0.01){
                const A = projectWorld(tu.x, tu.z, baseH, aspect);          // barrel pivot atop the base
                const corners = [[sB, sB], [-sB, sB], [-sB, -sB], [sB, -sB]].map(d => projectWorld(tu.x + d[0], tu.z + d[1], 0, aspect));
                // same shading as the ships: a multiply-darken body + additive glow over the base pyramid
                const top = Math.min(0.4, 0.45 * fade), tglow = CONFIG.shipFill * 0.7 * fade;
                const triF = (p0, p1, p2) => {
                    pushTriClip(p0.x, p0.y, p1.x, p1.y, p2.x, p2.y, Math.sqrt(1 - top), WHITE);
                    pushTri2Clip(p0.x, p0.y, p1.x, p1.y, p2.x, p2.y, tglow, OM);
                };
                triF(corners[0], corners[1], corners[2]); triF(corners[0], corners[2], corners[3]);   // base
                for (let k = 0; k < 4; k++) triF(corners[k], corners[(k + 1) % 4], A);                // pyramid sides
                for (let k = 0; k < 4; k++){
                    const c0 = corners[k], c1 = corners[(k + 1) % 4];
                    pushLineClip(c0.x, c0.y, c1.x, c1.y, 0.7 * fade, OM);   // base ring on the grid
                    pushLineClip(c0.x, c0.y, A.x, A.y, 0.55 * fade, OM);   // spokes up to the pivot
                }
                const dx = tu.aim.x - tu.x, dy = tu.aim.h - baseH, dz = tu.aim.z - tu.z, dl = Math.hypot(dx, dy, dz) || 1;
                const B = projectWorld(tu.x + dx/dl*barrelLen, tu.z + dz/dl*barrelLen, baseH + dy/dl*barrelLen, aspect);
                pushLineClip(A.x, A.y, B.x, B.y, 1.0 * fade, OM);          // barrel toward the aim
                pushPt((B.x + 1) * 0.5, (1 - B.y) * 0.5, Math.min(11, B.inv * 22) * dprNow, OM[0]*1.3*fade, OM[1]*0.4*fade, OM[2]*0.4*fade);
            }
        }

        // --- falling embers + ground sparks from detonations ---
        for (const e of FX.embers){
            if (e.z < 0.5) continue;
            const P = projectWorld(e.x, e.z, e.y, aspect);
            if (P.inv <= 0) continue;
            const lf = Math.max(0, e.life / e.max), mx = 1 - lf;
            pushPt((P.x + 1) * 0.5, (1 - P.y) * 0.5, Math.min(7, P.inv * 22) * lf * dprNow,
                   (HOT[0] + (MAG[0]-HOT[0])*mx) * 1.2 * lf, (HOT[1] + (MAG[1]-HOT[1])*mx) * 1.2 * lf,
                   (HOT[2] + (MAG[2]-HOT[2])*mx) * 1.2 * lf);
        }
        for (const g of FX.groundSparks){
            const gp = g.age / g.dur, fade = 1 - gp;
            const ctr = projectWorld(g.x, g.z, 0, aspect);
            pushPt((ctr.x + 1) * 0.5, (1 - ctr.y) * 0.5, (4 + 10 * fade) * dprNow, HOT[0]*1.5*fade, HOT[1]*1.2*fade, HOT[2]*0.9*fade);
            const rr = 0.15 + g.age * 0.8;                                                  // small ring on the grid plane
            for (let k = 0; k < 8; k++){ const a = k / 8 * 6.2832;
                const Pr = projectWorld(g.x + Math.cos(a) * rr, g.z + Math.sin(a) * rr, 0, aspect);
                pushPt((Pr.x + 1) * 0.5, (1 - Pr.y) * 0.5, 3 * fade * dprNow, CYAN[0]*fade, CYAN[1]*fade, CYAN[2]*fade);
            }
        }

        return { lineVerts: li / 6, ptVerts: pi / 6, triVerts: ti / 6, tri2Verts: ti2 / 6,
                 lineFloats: li, ptFloats: pi, triFloats: ti, tri2Floats: ti2 };
    }

    // ──────────────────────────────────────────────────────────────
    //  Render
    // ──────────────────────────────────────────────────────────────
    function drawQuad(){ gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

    // upload + draw a buildFX result (translucent tris, then lines, then point sprites; additive).
    // triMul=true draws the tris with a MULTIPLY blend (hull fills darken bright backgrounds like the sun).
    function drawFX(fx, triMul){
        if (fx.triVerts){
            if (triMul) gl.blendFunc(gl.ZERO, gl.SRC_COLOR);   // result = dst * src  (darken the sun)
            gl.useProgram(GL.line);                // line shader is primitive-agnostic (pos/alpha/col)
            gl.bindVertexArray(fxTriVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, fxTriBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxTriData, 0, fx.triFloats);
            gl.drawArrays(gl.TRIANGLES, 0, fx.triVerts);
            if (triMul) gl.blendFunc(gl.ONE, gl.ONE);          // restore additive
        }
        if (triMul && fx.tri2Verts){               // additive neon-glass glow on top of the darken pass
            gl.useProgram(GL.line);
            gl.bindVertexArray(fxTri2VAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, fxTri2Buf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxTri2Data, 0, fx.tri2Floats);
            gl.drawArrays(gl.TRIANGLES, 0, fx.tri2Verts);
        }
        if (fx.lineVerts){
            gl.useProgram(GL.line);
            gl.bindVertexArray(fxLineVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, fxLineBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxLineData, 0, fx.lineFloats);
            gl.drawArrays(gl.LINES, 0, fx.lineVerts);
        }
        if (fx.ptVerts){
            gl.useProgram(GL.pt);
            gl.bindVertexArray(fxPtVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, fxPtBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, fxPtData, 0, fx.ptFloats);
            gl.drawArrays(gl.POINTS, 0, fx.ptVerts);
        }
    }

    function render(timeSec){
        const C = CONFIG.col;
        const geo = buildGeometry();

        // --- Pass 1: scene -> fboScene ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene.fb);
        gl.viewport(0, 0, sw, sh);
        gl.disable(gl.BLEND);
        gl.useProgram(GL.scene);
        gl.uniform2f(GL.sceneU.uRes, sw, sh);
        gl.uniform1f(GL.sceneU.uTime, timeSec);
        gl.uniform1f(GL.sceneU.uHeading, cam.headSend);
        gl.uniform1f(GL.sceneU.uPitch, cam.pitchSend);
        gl.uniform1f(GL.sceneU.uScroll, reduced ? 0.0 : CONFIG.gridScroll);
        gl.uniform1f(GL.sceneU.uHorizon, CONFIG.horizon);
        gl.uniform3fv(GL.sceneU.uCyan, C.cyan);
        gl.uniform3fv(GL.sceneU.uMagenta, C.magenta);
        gl.uniform1f(GL.sceneU.uSunOnly, 0.0);
        gl.uniform1f(GL.sceneU.uTerrainPass, 0.0);
        drawQuad();                                         // sky pass (no terrain yet)

        // network drawn additively on top (into the same FBO so bloom sees it)
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        if (geo.lineVerts){
            gl.useProgram(GL.line);
            gl.bindVertexArray(lineVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, lineData, 0, geo.lineFloats);
            gl.drawArrays(gl.LINES, 0, geo.lineVerts);
        }
        if (geo.ptVerts){
            gl.useProgram(GL.pt);
            gl.bindVertexArray(ptVAO);
            gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
            gl.bufferSubData(gl.ARRAY_BUFFER, 0, ptData, 0, geo.ptFloats);
            gl.drawArrays(gl.POINTS, 0, geo.ptVerts);
        }

        // background cameos (nebula, stars, ridge) — additive, BEFORE the sun so they sit behind it
        drawFX(buildFX(timeSec, true), false);

        // sun disc (alpha-blended) AFTER the network + background cameos — so they sit behind the sun
        gl.useProgram(GL.scene);
        gl.uniform1f(GL.sceneU.uSunOnly, 1.0);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        drawQuad();

        // TERRAIN pass: drawn AFTER sky/network/ridge/sun so it occludes them. Alpha-blended so NEAR terrain
        // is solid (occludes) while the FAR ridges fade out into the sky (depth alpha from the shader).
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.uniform1f(GL.sceneU.uSunOnly, 0.0);
        gl.uniform1f(GL.sceneU.uTerrainPass, 1.0);
        drawQuad();
        gl.uniform1f(GL.sceneU.uTerrainPass, 0.0);

        // foreground cameos in front of the terrain: hull fills MULTIPLY (silhouette the sun), edges/glows add
        gl.blendFunc(gl.ONE, gl.ONE);
        drawFX(buildFX(timeSec, false), true);
        gl.disable(gl.BLEND);

        // --- Pass 2: bright-pass -> fboA (half res) ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb);
        gl.viewport(0, 0, bw, bh);
        gl.useProgram(GL.bright);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboScene.tex);
        gl.uniform1i(GL.brightU.uTex, 0);
        drawQuad();

        // --- Pass 3: blur H (fboA->fboB) then V (fboB->fboA) ---
        gl.useProgram(GL.blur);
        gl.uniform1i(GL.blurU.uTex, 0);
        // horizontal
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboB.fb);
        gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
        gl.uniform2f(GL.blurU.uDir, 1.0 / bw, 0.0);
        drawQuad();
        // vertical
        gl.bindFramebuffer(gl.FRAMEBUFFER, fboA.fb);
        gl.bindTexture(gl.TEXTURE_2D, fboB.tex);
        gl.uniform2f(GL.blurU.uDir, 0.0, 1.0 / bh);
        drawQuad();

        // --- Pass 4: CRT composite -> screen ---
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, sw, sh);
        gl.useProgram(GL.crt);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboScene.tex);
        gl.uniform1i(GL.crtU.uScene, 0);
        gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboA.tex);
        gl.uniform1i(GL.crtU.uBloom, 1);
        gl.uniform2f(GL.crtU.uRes, sw, sh);
        gl.uniform1f(GL.crtU.uTime, timeSec);
        gl.uniform1f(GL.crtU.uReduced, reduced ? 1.0 : 0.0);
        gl.uniform1f(GL.crtU.uCurve, CONFIG.curvature);
        gl.uniform1f(GL.crtU.uChroma, CONFIG.chroma);
        gl.uniform1f(GL.crtU.uScanDepth, CONFIG.scanDepth);
        gl.uniform1f(GL.crtU.uVignette, CONFIG.vignette);
        gl.uniform1f(GL.crtU.uBloomStr, CONFIG.bloomStrength);
        drawQuad();
        gl.bindVertexArray(null);
    }

    // ──────────────────────────────────────────────────────────────
    //  Main loop
    // ──────────────────────────────────────────────────────────────
    let start = 0, lastFrame = 0, lastSim = 0, raf = 0;
    const frameMin = 1000 / CONFIG.fpsCap;

    function loop(now){
        raf = requestAnimationFrame(loop);
        if (now - lastFrame < frameMin) return;
        lastFrame = now;
        if (!start) { start = now; lastSim = now; }
        const dt = Math.min(0.05, (now - lastSim) / 1000);
        lastSim = now;
        const tSec = (now - start) / 1000;
        updateSim(dt);
        updateFX(dt);
        render(tSec);
    }

    function renderStatic(){
        // single frame for prefers-reduced-motion (no loop, no cameos)
        updateSim(0);
        render(0);
    }

    // ──────────────────────────────────────────────────────────────
    //  Events
    // ──────────────────────────────────────────────────────────────
    function setMouse(clientX, clientY){
        mouse.x = clientX / window.innerWidth;
        mouse.y = clientY / window.innerHeight;
        mouse.active = true;
    }
    window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
    window.addEventListener('mouseleave', () => mouse.active = false);
    window.addEventListener('touchmove', e => {
        if (e.touches.length) setMouse(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    let resizeT;
    window.addEventListener('resize', () => {
        clearTimeout(resizeT);
        resizeT = setTimeout(() => {
            allocFBOs();
            if (reduced) renderStatic();
        }, 120);
    });

    // pause when tab hidden (battery / thermal)
    document.addEventListener('visibilitychange', () => {
        if (reduced) return;
        if (document.hidden){ cancelAnimationFrame(raf); raf = 0; }
        else if (!raf){ lastFrame = 0; lastSim = performance.now(); raf = requestAnimationFrame(loop); }
    });

    // WebGL context loss / restore
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; }, false);
    canvas.addEventListener('webglcontextrestored', () => {
        buildGL(); allocFBOs(); initNodes();
        if (reduced) renderStatic(); else { lastFrame = 0; start = 0; raf = requestAnimationFrame(loop); }
    }, false);

    // ──────────────────────────────────────────────────────────────
    //  Boot
    // ──────────────────────────────────────────────────────────────
    try {
        buildGL();
        allocFBOs();
        initNodes();
        if (reduced) renderStatic();
        else raf = requestAnimationFrame(loop);
    } catch (err) {
        console.error(err);
        canvas.style.display = 'none';
        fallback.style.display = 'block';
    }
})();
</script>
</body>
</html>
