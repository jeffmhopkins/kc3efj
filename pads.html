<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ===========================================================================
   PAD STATUS — software 3D, dark neon, Star Fox / aquarium house style.
   world verts -> per-cell orbit camera -> perspective -> painter sort,
   flat-shaded fills + bright wireframe edges.  Six pads in a 2x3 grid:
   top row Falcon (SLC-4E, LC-39A, SLC-40), bottom row Starship.
   Real vehicle dimensions (m) drive proportions; one rocket per occupied pad,
   countdown to T-0, ignition + liftoff at T-0.   [mock data by default]
   =========================================================================== */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(1.75, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

/* ----------------------------------------------------------------- math */
const TAU = Math.PI*2;
const rnd = (a=1,b)=> b===undefined ? Math.random()*a : a+Math.random()*(b-a);
const clamp = (v,lo,hi)=> v<lo?lo : v>hi?hi : v;
const lerp = (a,b,t)=> a+(b-a)*t;
const norm3 = v=>{ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
const cross3 = (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const sub3 = (a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const LIGHT = norm3([0.38, 0.84, -0.4]);

/* ----------------------------------------------------- camera + project */
const cam = { pos:[0,10,-40], r:[1,0,0], u:[0,1,0], f:[0,0,1] };
let VX=0, VY=0, FOC=600, FOGN=10, FOGF=300;
function setupCell(rect, contentH, az, el){
  const tgtY = contentH*0.40;
  const dist = contentH*1.72;
  const ey   = tgtY + contentH*(el ?? 0.30);
  cam.pos = [Math.sin(az)*dist, ey, -Math.cos(az)*dist];
  const tgt=[0,tgtY,0];
  const f=norm3(sub3(tgt,cam.pos));
  const r=norm3([-f[2],0,f[0]]);
  cam.f=f; cam.r=r; cam.u=cross3(r,f);
  VX = rect.x + rect.w*0.5;
  VY = rect.y + rect.h*0.575;
  FOC = rect.h*0.86 * dist / contentH;
  FOGN = dist - contentH*0.9; FOGF = dist + contentH*1.1;
}
const fogAt = z => clamp(1-(z-FOGN)/(FOGF-FOGN), 0, 1)*0.85 + 0.15;
function project(p, dy){
  const px=p[0], py=p[1]+(dy||0), pz=p[2];
  const dx=px-cam.pos[0], d1=py-cam.pos[1], dz=pz-cam.pos[2];
  const z = dx*cam.f[0]+d1*cam.f[1]+dz*cam.f[2];
  if (z < 0.5) return { vis:false };
  const x = dx*cam.r[0]+d1*cam.r[1]+dz*cam.r[2];
  const y = dx*cam.u[0]+d1*cam.u[1]+dz*cam.u[2];
  const inv = FOC/z;
  return { vis:true, x:VX+x*inv, y:VY-y*inv, z, inv };
}

/* ----------------------------------------------- render list + drawing */
const RL = [];
function pushFaces(verts, faces, dy){
  const pj = new Array(verts.length);
  for (const f of faces){
    const idx=f.i; let ok=true;
    for (const k of idx){ if (pj[k]===undefined) pj[k]=project(verts[k],dy); if(!pj[k].vis){ok=false;break;} }
    if (!ok) continue;
    const A=verts[idx[0]], B=verts[idx[1]], C=verts[idx[2]];
    const n=norm3(cross3(sub3(B,A),sub3(C,A)));
    let lum=Math.abs(n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
    let depth=0; for (const k of idx) depth+=pj[k].z; depth/=idx.length;
    const m=f.mat;
    RL.push({ pts:idx.map(k=>pj[k]), depth,
      h:m.h, s:m.s, l:clamp(m.l0 + lum*m.l1, 0, 94), eh:m.h, es:m.s, el:m.le,
      a:fogAt(depth)*(m.a??1), eA:m.eA??0.85 });
  }
}
function line3(p, q, m, dy, w){
  const A=project(p,dy), B=project(q,dy);
  if (!A.vis || !B.vis) return;
  const depth=(A.z+B.z)/2;
  RL.push({ line:true, x1:A.x, y1:A.y, x2:B.x, y2:B.y, depth,
    h:m.h, s:m.s, l:m.le, a:fogAt(depth)*(m.a??1), w:w??1.2 });
}
function spark(p, r, m, dy){
  const P=project(p,dy); if(!P.vis) return;
  RL.push({ point:true, x:P.x, y:P.y, r:Math.max(1.1, r*P.inv), depth:P.z-0.01,
    h:m.h, s:m.s, l:m.le, a:fogAt(P.z)*(m.a??1) });
}
function flush(){
  RL.sort((a,b)=> b.depth-a.depth);
  ctx.lineJoin='round'; ctx.lineCap='round';
  for (const f of RL){
    if (f.line){
      ctx.strokeStyle=`hsla(${f.h},${f.s}%,${f.l}%,${f.a})`;
      ctx.lineWidth=f.w; ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); ctx.stroke();
      continue;
    }
    if (f.point){
      ctx.save(); ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=`hsla(${f.h},${f.s}%,${f.l}%,${f.a*0.3})`;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r*3,0,TAU); ctx.fill();
      ctx.fillStyle=`hsla(${f.h},${f.s}%,${Math.min(96,f.l+18)}%,${f.a})`;
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,TAU); ctx.fill();
      ctx.restore(); continue;
    }
    ctx.beginPath(); ctx.moveTo(f.pts[0].x, f.pts[0].y);
    for (let k=1;k<f.pts.length;k++) ctx.lineTo(f.pts[k].x, f.pts[k].y);
    ctx.closePath();
    ctx.fillStyle=`hsla(${f.h},${f.s}%,${f.l}%,${f.a*0.92})`; ctx.fill();
    ctx.strokeStyle=`hsla(${f.eh},${f.es}%,${f.el}%,${f.a*f.eA})`;
    ctx.lineWidth=1; ctx.stroke();
  }
  RL.length=0;
}

/* --------------------------------------------------------- palettes */
// material -> {h,s,l0,l1,le(edge L),a}
const PALETTES = {
  neon: {
    falconBody:{h:198,s:18,l0:20,l1:26,le:64}, dragon:{h:190,s:20,l0:34,l1:30,le:82},
    booster:{h:205,s:14,l0:18,l1:24,le:60}, shipSteel:{h:200,s:12,l0:26,l1:28,le:72},
    shipNose:{h:200,s:12,l0:30,l1:28,le:80}, flap:{h:300,s:60,l0:24,l1:24,le:74},
    fin:{h:300,s:55,l0:26,l1:22,le:72},
    towerF:{h:188,s:70,l0:0,l1:0,le:50}, towerS:{h:188,s:70,l0:0,l1:0,le:54},
    pad:{h:188,s:65,l0:0,l1:0,le:34}, deck:{h:300,s:60,l0:0,l1:0,le:40},
    plume:{h:312,s:90,l0:0,l1:0,le:66}, plumeHot:{h:38,s:95,l0:0,l1:0,le:70},
    steel:{h:200,s:10,l0:9,l1:15,le:50}, tank:{h:190,s:18,l0:16,l1:18,le:60},
    label:'#5ef2ff', sub:'#4a6f7a', go:'#5effa6', hold:'#ffd27c', clear:'#54808c', lift:'#ff5ec8'
  },
  vtrue: {
    falconBody:{h:210,s:8,l0:30,l1:34,le:88}, dragon:{h:210,s:6,l0:40,l1:34,le:94},
    booster:{h:210,s:8,l0:26,l1:30,le:78}, shipSteel:{h:210,s:9,l0:30,l1:34,le:84},
    shipNose:{h:30,s:30,l0:32,l1:30,le:78}, flap:{h:24,s:40,l0:24,l1:26,le:70},
    fin:{h:210,s:8,l0:24,l1:24,le:70},
    towerF:{h:200,s:50,l0:0,l1:0,le:52}, towerS:{h:30,s:55,l0:0,l1:0,le:56},
    pad:{h:200,s:30,l0:0,l1:0,le:36}, deck:{h:30,s:40,l0:0,l1:0,le:44},
    plume:{h:30,s:96,l0:0,l1:0,le:70}, plumeHot:{h:48,s:96,l0:0,l1:0,le:82},
    steel:{h:210,s:8,l0:13,l1:18,le:62}, tank:{h:205,s:12,l0:20,l1:18,le:72},
    label:'#add6ff', sub:'#5a6f82', go:'#7effb0', hold:'#ffce7a', clear:'#5a6f82', lift:'#ff9a3c'
  },
  crt: {
    falconBody:{h:140,s:80,l0:14,l1:30,le:60}, dragon:{h:140,s:80,l0:22,l1:32,le:78},
    booster:{h:140,s:80,l0:12,l1:28,le:56}, shipSteel:{h:140,s:80,l0:16,l1:30,le:64},
    shipNose:{h:140,s:80,l0:20,l1:30,le:74}, flap:{h:140,s:90,l0:18,l1:26,le:70},
    fin:{h:140,s:90,l0:18,l1:24,le:68},
    towerF:{h:140,s:90,l0:0,l1:0,le:46}, towerS:{h:140,s:90,l0:0,l1:0,le:50},
    pad:{h:140,s:90,l0:0,l1:0,le:30}, deck:{h:140,s:90,l0:0,l1:0,le:38},
    plume:{h:150,s:95,l0:0,l1:0,le:72}, plumeHot:{h:90,s:95,l0:0,l1:0,le:80},
    steel:{h:140,s:80,l0:8,l1:16,le:46}, tank:{h:140,s:85,l0:14,l1:16,le:58},
    label:'#39ff7a', sub:'#1f6f43', go:'#39ff7a', hold:'#aaff66', clear:'#1f6f43', lift:'#7dff9e'
  }
};
let PAL = PALETTES.vtrue;

/* --------------------------------------------------- geometry builders */
// surface of revolution: profile = [[r,y],...]; seg radial
function lathe(profile, seg, mat){
  const verts=[], faces=[], rings=[];
  for (const [r,y] of profile){
    const ring=[];
    for (let j=0;j<seg;j++){ const a=j/seg*TAU; verts.push([Math.cos(a)*r,y,Math.sin(a)*r]); ring.push(verts.length-1); }
    rings.push(ring);
  }
  for (let i=0;i<rings.length-1;i++)
    for (let j=0;j<seg;j++){ const k=(j+1)%seg;
      faces.push({ i:[rings[i][j],rings[i][k],rings[i+1][k],rings[i+1][j]], mat }); }
  return { verts, faces };
}
// flat quad panel from 4 points
function panel(a,b,c,d,mat){ return { verts:[a,b,c,d], faces:[{i:[0,1,2,3],mat}] }; }
function merge(parts){
  const verts=[], faces=[];
  for (const p of parts){ const off=verts.length; for (const v of p.verts) verts.push(v);
    for (const f of p.faces) faces.push({ i:f.i.map(k=>k+off), mat:f.mat }); }
  return { verts, faces };
}

let SEG = 8;                        // radial detail (toggle)
const MODELS = {};                  // built per detail level
function buildModels(){
  const seg=SEG, M=PAL;
  // --- Falcon 9 + fairing : 70 m, body Ø3.7 (r1.85), fairing Ø5.2 (r2.6)
  MODELS.f9fairing = (()=>{
    const body = lathe([[1.85,0],[1.85,1.5],[1.85,40],[1.74,42.5],[1.85,45],[1.85,57.5],
      [2.6,60.8],[2.6,66],[1.5,68.6],[0.05,70]], seg, M.falconBody);
    const fins=[]; for (let k=0;k<4;k++){ const a=k/4*TAU; const cx=Math.cos(a),sz=Math.sin(a);
      fins.push(panel([cx*1.85,40.5,sz*1.85],[cx*3.1,41.5,sz*3.1],[cx*3.1,39.3,sz*3.1],[cx*1.85,38.6,sz*1.85],M.fin)); }
    return merge([body,...fins]);
  })();
  // --- Falcon 9 + Dragon : ~63 m, capsule Ø4 (r2.0)
  MODELS.f9dragon = (()=>{
    const stack = lathe([[1.85,0],[1.85,1.5],[1.85,40],[1.74,42.5],[1.85,45],[1.85,55]], seg, M.falconBody);
    const drag  = lathe([[1.95,55],[1.95,58.6],[2.0,58.8],[1.9,59.2],[1.35,61.6],[0.55,63.3]], seg, M.dragon);
    const fins=[]; for (let k=0;k<4;k++){ const a=k/4*TAU; const cx=Math.cos(a),sz=Math.sin(a);
      fins.push(panel([cx*1.85,40.5,sz*1.85],[cx*3.1,41.5,sz*3.1],[cx*3.1,39.3,sz*3.1],[cx*1.85,38.6,sz*1.85],M.fin)); }
    return merge([stack,drag,...fins]);
  })();
  // --- Super Heavy booster only : 71 m, Ø9 (r4.5)
  MODELS.booster = (()=>{
    const body = lathe([[4.5,0],[4.5,3],[4.5,66],[4.5,69],[4.2,71]], seg, M.booster);
    const fins=[]; for (let k=0;k<4;k++){ const a=k/4*TAU+0.4; const cx=Math.cos(a),sz=Math.sin(a);
      fins.push(panel([cx*4.5,63,sz*4.5],[cx*6.6,64.5,sz*6.6],[cx*6.6,61,sz*6.6],[cx*4.5,59.5,sz*4.5],M.fin)); }
    return merge([body,...fins]);
  })();
  // --- Starship stacked : ~123 m total (SH 0..71, ship 73..123, Ø9)
  MODELS.shipStacked = (()=>{
    const sh   = lathe([[4.5,0],[4.5,3],[4.5,66],[4.5,69],[4.3,71]], seg, M.booster);
    const ship = lathe([[4.4,73],[4.5,75],[4.5,104],[4.35,108],[3.0,116],[1.4,120.5],[0.05,123]], seg, M.shipSteel);
    const nose = lathe([[3.0,116],[1.4,120.5],[0.05,123]], seg, M.shipNose);
    const parts=[sh,ship,nose];
    // aft flaps (2) ~ y78, forward flaps (2) ~ y110
    for (const [yy,rr,ln] of [[78,4.5,7],[110,4.5,6]])
      for (const s of [1,-1]){ const a= s>0?0:Math.PI; const cx=Math.cos(a),sz=Math.sin(a);
        parts.push(panel([cx*rr,yy,sz*rr],[cx*(rr+3.0),yy+1.5,sz*(rr+3.0)],
          [cx*(rr+3.0),yy+1.5+ln,sz*(rr+3.0)],[cx*rr,yy+ln+2,sz*rr], M.flap)); }
    return merge(parts);
  })();
}

/* --------------------------------------------------- pad / GSE builders
   Built from accurate primitives (box truss, hinged strongback, ring/deck
   launch mounts, flame trench, chopstick arms) at real-ish dimensions (m).
   Rocket centerline at x=0; towers/strongbacks offset along x.            */
const D2R=Math.PI/180;
function drawBox(cx,cy,cz,w,h,d,mat){
  const x0=cx-w/2,x1=cx+w/2,y0=cy,y1=cy+h,z0=cz-d/2,z1=cz+d/2;
  const v=[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]];
  const f=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]].map(i=>({i,mat}));
  pushFaces(v,f,0);
}
// ground apron: square outline + faint grid
function drawGround(size, mat){
  const h=size/2, c=[[-h,0,-h],[h,0,-h],[h,0,h],[-h,0,h]];
  for(let k=0;k<4;k++) line3(c[k],c[(k+1)%4],mat,0,1.1);
  const n=4; for(let i=1;i<n;i++){ const t=-h+size*i/n;
    line3([t,0,-h],[t,0,h],mat,0,.4); line3([-h,0,t],[h,0,t],mat,0,.4); }
}
// vertical box-truss tower: 4 legs + rungs + X-braces; opt.crown hammerhead, opt.base solid lower block
function latticeTower(cx,cz,w,d,h,bays,mat,opt){
  opt=opt||{}; const yb=opt.y0||0;          // base elevation (39A FSS rises from the raised pad surface)
  const hx=w/2,hz=d/2, c=[[cx-hx,cz-hz],[cx+hx,cz-hz],[cx+hx,cz+hz],[cx-hx,cz+hz]];
  for(const [x,z] of c) line3([x,yb,z],[x,yb+h,z],mat,0,1.3);
  const dy=h/bays;
  for(let b=0;b<=bays;b++){ const y=yb+b*dy; for(let k=0;k<4;k++){ const a=c[k],e=c[(k+1)%4];
    line3([a[0],y,a[1]],[e[0],y,e[1]],mat,0,.9); } }
  for(let b=0;b<bays;b++){ const y0=yb+b*dy,y1=yb+(b+1)*dy; for(let k=0;k<4;k++){ const a=c[k],e=c[(k+1)%4];
    if((b+k)%2) line3([a[0],y0,a[1]],[e[0],y1,e[1]],mat,0,.6);
    else        line3([a[0],y1,a[1]],[e[0],y0,e[1]],mat,0,.6); } }
  if(opt.base) drawBox(cx,yb,cz,w*1.08,opt.base,d*1.08,opt.baseMat||mat);  // concrete-filled base
  if(opt.crown){ const t=yb+h, cw=w*0.6;                                  // hammerhead crane
    line3([cx-cw,t,cz],[cx+cw*1.9,t,cz],mat,0,1.5);
    line3([cx+cw*1.9,t,cz],[cx+cw*1.9,t-7,cz],mat,0,1.1);
    line3([cx-cw,t,cz],[cx-cw,t-4,cz],mat,0,1); }
}
// slender hinged strongback beside rocket; tilts `tilt` rad away from rocket (+x)
function strongback(bx,bz,L,w,tilt,mat,fracs,reachX,y0){
  y0=y0||0;        // base elevation: TE hinges at the pad surface (raised at 39A)
  const ux=Math.sin(tilt),uy=Math.cos(tilt), hw=w/2, cs=Math.cos(tilt),sn=Math.sin(tilt);
  const P=(t,a,b)=>[ bx+ux*t + cs*hw*a, y0 + uy*t - sn*hw*a, bz + hw*b ];
  const ch=[[-1,-1],[1,-1],[1,1],[-1,1]];
  for(const [a,b] of ch) line3(P(0,a,b),P(L,a,b),mat,0,1.3);
  const bays=Math.max(6,Math.round(L/5));
  for(let i=0;i<=bays;i++){ const t=L*i/bays; for(let k=0;k<4;k++){ const a=ch[k],e=ch[(k+1)%4];
    line3(P(t,a[0],a[1]),P(t,e[0],e[1]),mat,0,.8); } }
  for(let i=0;i<bays;i++){ const t0=L*i/bays,t1=L*(i+1)/bays; for(let k=0;k<4;k++){ const a=ch[k],e=ch[(k+1)%4];
    if((i+k)%2) line3(P(t0,a[0],a[1]),P(t1,e[0],e[1]),mat,0,.55);
    else        line3(P(t1,a[0],a[1]),P(t0,e[0],e[1]),mat,0,.55); } }
  for(const f of (fracs||[])){ const t=f*L; const p1=P(t,-1,-1),p2=P(t,-1,1);          // umbilical claws -> rocket
    const tip=[(p1[0]+p2[0])/2-reachX,(p1[1]+p2[1])/2,(p1[2]+p2[2])/2];
    line3(p1,tip,mat,0,1); line3(p2,tip,mat,0,1); line3(p1,p2,mat,0,.8); }
}
// Falcon Heavy widened TE base: straddles the two side cores (z=±sideZ) for the bottom `height` m,
// with two low side-booster umbilical arms. Tilts with the strongback (hinge at bx).
function fhBase(bx,bz,zHalf,height,w,tilt,mat,sideZ,y0){
  y0=y0||0;
  const ux=Math.sin(tilt),uy=Math.cos(tilt), cs=Math.cos(tilt),sn=Math.sin(tilt), hw=w/2;
  const P=(t,a,z)=>[ bx+ux*t+cs*hw*a, y0 + uy*t-sn*hw*a, bz+z ];
  const corn=[[-1,-zHalf],[1,-zHalf],[1,zHalf],[-1,zHalf]];
  for(const [a,z] of corn) line3(P(0,a,z),P(height,a,z),mat,0,1.2);
  const bays=Math.max(2,Math.round(height/5));
  for(let i=0;i<=bays;i++){ const t=height*i/bays; for(let k=0;k<4;k++){ const a=corn[k],e=corn[(k+1)%4];
    line3(P(t,a[0],a[1]),P(t,e[0],e[1]),mat,0,.7); } }
  for(const s of [1,-1]) for(const h of [5,10]){ const r=P(h,-1,s*zHalf); line3(r,[0.5,r[1],s*sideZ],mat,0,1); }
}
function mast(x,z,h,mat){ line3([x,0,z],[x,h,z],mat,0,1.3); line3([x-2.2,h-3,z],[x+2.2,h-3,z],mat,0,1); }
// crew access arm swinging from a tower toward the rocket; ext 1=mated, 0=retracted
function crewArm(tx,tz,h,len,ext,mat){
  const dir=(tx<0)?1:-1, reach=len*ext, swingZ=len*(1-ext)*0.8;
  const ex=tx+dir*reach, ez=tz+swingZ;
  line3([tx,h,tz],[ex,h,ez],mat,0,1.3); line3([tx,h+3,tz],[ex,h+3,ez],mat,0,1); line3([ex,h,ez],[ex,h+3,ez],mat,0,1);
}
// raised launch mound (39A Falcon) with a flame trench across the top
function mound(size,h,mat,deck,trH){
  const b=size/2, tp=size*0.4, t=trH||size*0.13;
  const bv=[[-b,0,-b],[b,0,-b],[b,0,b],[-b,0,b]], tv=[[-tp,h,-tp],[tp,h,-tp],[tp,h,tp],[-tp,h,tp]];
  pushFaces(tv,[{i:[0,1,2,3],mat:deck}],0);
  for(let k=0;k<4;k++){ line3(bv[k],bv[(k+1)%4],mat,0,1); line3(tv[k],tv[(k+1)%4],mat,0,1.1); line3(bv[k],tv[k],mat,0,.85); }
  line3([-tp,h,-t],[tp,h,-t],deck,0,.8); line3([-tp,h,t],[tp,h,t],deck,0,.8);   // flame opening (wider for FH)
}
// sunken flame trench (Pad 2 / 39A Starship)
function trench(len,w,mat){ const hl=len/2,hw=w/2,dp=-5;
  const top=[[-hw,0,-hl],[hw,0,-hl],[hw,0,hl],[-hw,0,hl]];
  for(let k=0;k<4;k++){ line3(top[k],top[(k+1)%4],mat,0,1);
    line3(top[k],[top[k][0],dp,top[k][2]],mat,0,.55);
    line3([top[k][0],dp,top[k][2]],[top[(k+1)%4][0],dp,top[(k+1)%4][2]],mat,0,.5); } }
// Pad-1 OLM: ring table on N splayed legs, booster elevated to h; flat deflector slab beneath
function olmTable(h,ringR,legs,frame,deck){
  const ring=lathe([[ringR,h-3.5],[ringR,h],[ringR-1.3,h],[ringR-1.3,h-2.8]],8,deck);
  pushFaces(ring.verts,ring.faces,0);
  for(let k=0;k<legs;k++){ const a=k/legs*TAU;
    line3([Math.cos(a)*ringR*1.55,0,Math.sin(a)*ringR*1.55],[Math.cos(a)*ringR*0.96,h-1.5,Math.sin(a)*ringR*0.96],frame,0,1.5); }
  drawBox(0,0.15,0,ringR*2.6,0.4,ringR*2.6,deck);
}
// Pad-2 / 39A OLM: low square deck on 4 short legs over the trench
function olmDeck(h,w,frame,deck){
  drawBox(0,Math.max(0,h-2),0,w,2,w,deck);
  for(const [sx,sz] of [[1,1],[1,-1],[-1,1],[-1,-1]])
    line3([sx*w*0.42,0,sz*w*0.42],[sx*w*0.42,h-2,sz*w*0.42],frame,0,1.4);
}
// two chopstick catch arms on a carriage, reaching toward rocket (-x); open spreads in z
function catchArms(tx,tz,h,len,open,mat){
  for(const s of [1,-1]){ const z0=tz+s*1.4, z1=tz+s*(1.4+open);
    const root=[tx,h,z0], tip=[tx-len,h,z1];
    line3(root,tip,mat,0,1.6); line3([root[0],h+3.5,root[2]],[tip[0],h+3.5,tip[2]],mat,0,1.2);
    line3(tip,[tip[0],h+3.5,tip[2]],mat,0,1); line3(root,[root[0],h+3.5,root[2]],mat,0,1); }
  drawBox(tx,h-2.5,tz,4,7,9,mat);                                          // carriage
}
function qdArm(tx,tz,h,len,swing,mat){ const ex=tx-len*(1-swing*0.45), ez=tz+swing*8;
  line3([tx,h,tz],[ex,h,ez],mat,0,1.3); line3([ex,h,ez],[ex,h-2.5,ez],mat,0,1); }
function tankFarm(ox,oz,n,mat){ for(let i=0;i<n;i++){ const x=ox+(i%3)*8, z=oz+Math.floor(i/3)*9;
  const t=lathe([[2.6,0],[2.6,15],[1.9,17]],6,mat); pushFaces(t.verts.map(v=>[v[0]+x,v[1],v[2]+z]),t.faces,0); } }

// master: draw one pad's ground support, animated by liftoff factor lf (0..1)
function drawGSE(p, lf){
  const F=p.fam==='starship'?PAL.towerS:PAL.towerF, ST=PAL.steel, TK=PAL.tank;
  drawGround(p.pad, PAL.pad);
  if (p.fam==='falcon'){
    const sbX=1.85+2.6, tilt=lf*45*D2R, sbW=p.fh?4:3;

    } else {

    }
    if (p.site==='40'){ const tx=-(1.85+5+4.5), nf=tx+4.5;         // SpaceX crew tower ~85m, set back from rocket
      latticeTower(tx,0,9,9,85,12,F); crewArm(nf,0,p.baseY+56,-nf-1.85,1-lf,F);
      mast(11,-13,52,F); mast(-15,12,46,F); }
    if (p.site==='39A'){ const tx=-(1.85+1.6+5.5), nf=tx+5.5, ft=p.baseY+104;   // FSS rises from the raised pad surface
      latticeTower(tx,p.baseY,11,11,104,13,F,{crown:true,y0:p.baseY});
      line3([tx,ft,0],[tx,ft+20,0],F,0,1.3); line3([tx-2.4,ft+16,0],[tx+2.4,ft+16,0],F,0,1);  // roof lightning mast
      crewArm(nf,0,p.baseY+56,-nf-1.85,1-lf,F); }
    if (p.site==='4E'){ mast(11,8,46,F); mast(-10,10,38,F); mast(9,-12,53,F); mast(-11,-9,40,F); }
  } else {
    const towerX=4.5+6+2, th=p.towerH;

    latticeTower(towerX,0,12,12,th,p.towerBays,F, p.site==='pad2'?{base:18,baseMat:ST}:null);
    catchArms(towerX,0,th*0.42,p.armLen,2+lf*5,F);

}

/* ----------------------------------------------------- state + render */
const WINDOW_MS = 6*3600e3;          // show a rocket if launch within this window
const ASCENT = 5.2;                  // visual liftoff accel (m/s^2-ish)
let DATA='mock';

function updatePad(p, now){
  if (p.net==null){ p.phase='empty'; return; }
  const T=(p.net-now)/1000;          // seconds to T-0 (neg after)
  if (DATA==='live' && T>WINDOW_MS/1000){ p.phase='empty'; return; }
  p.T=T;
  if (T>0){ p.phase = T<60 ? 'terminal' : 'count'; p.y=0; p.retract = T<60 ? clamp((60-T)/55,0,1) : 0; }
  else {
    const dt=-T;                     // seconds since liftoff
    p.y = ASCENT*dt*dt;              // accelerating climb
    p.phase = (p.y > p.contentH*1.5) ? 'gone' : 'liftoff';
    p.retract=1;
    if (p.phase==='gone' && !p.recycled && DATA==='mock'){ p.recycled=true;
      setTimeout(()=>{ p.net = Date.now() + (40+rnd(60))*1000; p.recycled=false; p.gone=false; }, 4200); }
  }
}

function drawRocket(p, t){
  const m=MODELS[p.veh]; if(!m) return;
  pushFaces(m.verts, m.faces, (p.baseY||0)+p.y);
  if (p.phase==='liftoff' || (p.phase==='terminal' && p.T<3)) drawPlume(p, t);
}
function drawPlume(p, t){
  const y0=(p.baseY||0)+p.y;
  const r = p.fam==='starship'?4.0:1.7;
  const len = p.fam==='starship'?34:20;
  const mode = PLUME, hot=PAL.plumeHot, soft=PAL.plume;
  const intensity = p.phase==='liftoff'?1:0.4;
  if (mode==='solid'){
    const seg=Math.max(6,SEG); const tip=[0,y0-len*intensity,0];
    for (let j=0;j<seg;j++){ const a=j/seg*TAU,b=(j+1)/seg*TAU; const m=(j%2)?hot:soft;
      RL_pushTri([Math.cos(a)*r,y0+0.3,Math.sin(a)*r],[Math.cos(b)*r,y0+0.3,Math.sin(b)*r],tip,m); }
  } else if (mode==='particles'){
    const n=Math.floor(26*intensity);
    for (let i=0;i<n;i++){ const a=rnd(TAU), rr=rnd(r*1.1); const dd=rnd(len*intensity);
      spark([Math.cos(a)*rr*(1+dd*0.04), y0-dd, Math.sin(a)*rr*(1+dd*0.04)], rr<r*0.4?1.1:0.7, dd<len*0.3?hot:soft, 0); }
  } else { // cone (default) — flickering streaks + glow core
    const fl=0.7+0.3*Math.sin(t*0.05+p.id), n=Math.max(7,SEG);
    for (let j=0;j<n;j++){ const a=j/n*TAU; const rr=r*(0.4+0.6*Math.random());
      line3([Math.cos(a)*rr,y0+0.4,Math.sin(a)*rr],[Math.cos(a)*rr*0.2,y0-len*intensity*fl*(0.7+0.5*Math.random()),Math.sin(a)*rr*0.2], j%3?soft:hot, 0, 1.4); }
    spark([0,y0-len*0.25*intensity,0], r*1.4, hot, 0);
  }
}
function RL_pushTri(a,b,c,m){
  const A=project(a,0),B=project(b,0),C=project(c,0);
  if(!A.vis||!B.vis||!C.vis) return;
  RL.push({ pts:[A,B,C], depth:(A.z+B.z+C.z)/3, h:m.h,s:m.s,l:m.le,eh:m.h,es:m.s,el:Math.min(95,m.le+12),
    a:0.5, eA:0.6 });
}

/* ---------------------------------------------------------- 2D HUD */
function drawCellHUD(rect, p, now){
  const big = rect.h > H*0.66, s = big?1.9:1, pad = Math.round(10*(big?1.4:1));
  const R = n=>Math.round(n*s);
  ctx.save(); ctx.textBaseline='top';
  ctx.strokeStyle='rgba(94,242,255,0.10)'; ctx.lineWidth=1;
  ctx.strokeRect(rect.x+0.5, rect.y+0.5, rect.w-1, rect.h-1);
  // label
  ctx.font=`bold ${R(15)}px 'Courier New', monospace`;
  ctx.fillStyle=PAL.label; ctx.shadowColor=PAL.label; ctx.shadowBlur=8;
  ctx.fillText(p.name, rect.x+pad, rect.y+pad); ctx.shadowBlur=0;
  ctx.font=`${R(9)}px 'Courier New', monospace`; ctx.fillStyle=PAL.sub;
  ctx.fillText(p.loc, rect.x+pad, rect.y+pad+R(17));
  ctx.textAlign='right'; ctx.fillText('PAD '+p.id, rect.x+rect.w-pad, rect.y+pad); ctx.textAlign='left';
  p._hit = { label:{ x:rect.x, y:rect.y, w:rect.w*0.62, h:pad+R(30) } };
  // status + T-time
  let stTxt, stCol, tTxt='';
  if (p.phase==='empty'){
    if (p.status==='WIP'){ stTxt='● TOWER WIP'; stCol=PAL.hold; tTxt='NO FLIGHT'; }
    else { stTxt='○ PAD CLEAR'; stCol=PAL.clear; tTxt='—'; }
  } else if (p.phase==='liftoff' || p.phase==='gone'){
    stTxt='▲ LIFTOFF'; stCol=PAL.lift; tTxt='T+'+fmtT(Math.max(0,-p.T));
  } else {
    const go=p.status==='GO';
    stTxt=(go?'● GO FOR LAUNCH':'◐ '+(p.status==='TBC'?'TO BE CONFIRMED':p.status));
    stCol=go?PAL.go:PAL.hold; tTxt='T-'+fmtT(p.T);
    if (p.phase==='terminal'){ stTxt='◉ TERMINAL COUNT'; stCol=PAL.go; }
  }
  ctx.font=`${R(11)}px 'Courier New', monospace`; ctx.fillStyle=stCol; ctx.shadowColor=stCol; ctx.shadowBlur=6;
  ctx.fillText(stTxt, rect.x+pad, rect.y+rect.h-pad-R(30)); ctx.shadowBlur=0;
  ctx.font=`bold ${R(22)}px 'Courier New', monospace`; ctx.fillStyle=tTxt.startsWith('T+')?PAL.lift:PAL.label;
  ctx.fillText(tTxt, rect.x+pad, rect.y+rect.h-pad-R(22));
  p._hit.ttime = { x:rect.x, y:rect.y+rect.h-pad-R(56), w:Math.max(150,rect.w*0.5), h:R(58) };
  if (p.veh && p.phase!=='empty'){
    ctx.font=`${R(9)}px 'Courier New', monospace`; ctx.fillStyle=PAL.sub; ctx.textAlign='right';
    ctx.fillText(VEH_LABEL[p.veh], rect.x+rect.w-pad, rect.y+rect.h-pad-2); ctx.textAlign='left';
  }
  if (big){ ctx.font="11px 'Courier New', monospace"; ctx.fillStyle=PAL.sub; ctx.textAlign='right';
    ctx.fillText('tap name / T-time to exit', rect.x+rect.w-pad, rect.y+pad+R(13)); ctx.textAlign='left'; }
  ctx.restore();
}
const VEH_LABEL={ f9fairing:'FALCON 9 · FAIRING', f9dragon:'FALCON 9 · DRAGON', booster:'SUPER HEAVY', shipStacked:'STARSHIP · STACKED' };
function fmtT(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }

/* ----------------------------------------------------------- layout */
function cellRect(i){
  const col=i%3, row=Math.floor(i/3);
  const gx=2, gy=2;
  const cw=(W-gx*4)/3, ch=(H-gy*3)/2;
  return { x:gx+col*(cw+gx), y:gy+row*(ch+gy), w:cw, h:ch };
}

/* -------------------------------------------------------- main loop */
let CAM='auto', PLUME='particles', FOCUS=null, t0=performance.now();
const VIEWS=['orbit','fixed','front'];
function pickView(){ return VIEWS[Math.floor(Math.random()*VIEWS.length)]; }  // current stays a candidate
function frame(now){
  const tt=(now-t0)*0.06;
  const realNow=Date.now();
  ctx.fillStyle='#050510'; ctx.fillRect(0,0,W,H);
  const list = FOCUS!=null ? [FOCUS] : [0,1,2,3,4,5];
  for (const i of list){
    const p=PADS[i], rect = FOCUS!=null ? {x:0,y:0,w:W,h:H} : cellRect(i);
    updatePad(p, realNow);
    let view;
    if (CAM==='auto'){
      if (!p.viewNext || realNow>=p.viewNext){ p.view=pickView(); p.viewNext=realNow + 15000+Math.random()*15000; }
      view=p.view;
    } else view=CAM;
    const az = view==='front' ? 0 : view==='fixed' ? 0.62 : tt*0.0015 + i*1.0;  // orbit at 1/3 speed
    const el = view==='front' ? 0.12 : 0.30;
    setupCell(rect, p.contentH, az, el);
    ctx.save();
    ctx.beginPath(); ctx.rect(rect.x,rect.y,rect.w,rect.h); ctx.clip();
    const lf = (p.phase==='liftoff'||p.phase==='gone') ? 1 : (p.phase==='terminal' ? clamp(p.retract,0,1)*0.18 : 0);
    drawGSE(p, lf);
    if (p.veh && p.phase!=='empty') drawRocket(p, now);
    flush();
    ctx.restore();
    drawCellHUD(rect, p, realNow);
  }
  // global CRT vignette + scanlines
  ctx.save();
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,6,0.5)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.05; ctx.fillStyle='#000';
  for (let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.restore();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------- tap-to-zoom focus */
// touching a pad's name or T-time zooms that pad full screen; tap again to exit
function hitRect(r,x,y){ return r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
function onTap(e){
  const rb=canvas.getBoundingClientRect(), x=e.clientX-rb.left, y=e.clientY-rb.top;
  if (FOCUS!=null){ const h=PADS[FOCUS]._hit; if(h && (hitRect(h.label,x,y)||hitRect(h.ttime,x,y))) FOCUS=null; return; }
  for (let i=0;i<6;i++){ const h=PADS[i]._hit; if(h && (hitRect(h.label,x,y)||hitRect(h.ttime,x,y))){ FOCUS=i; break; } }
}
canvas.addEventListener('pointerdown', onTap);

function launchNext(){
  let best=null; for (const p of PADS) if (p.net && p.net>Date.now() && (!best||p.net<best.net)) best=p;
  if (best) best.net = Date.now()+1500;
}
function note(){}   // no-op (control panel removed)

/* ------------------------------------------------------- live (LL2) */
async function goLive(){
  note('fetching live data from Launch Library 2 …');
  try{
    const cacheRaw=localStorage.getItem('padcache');
    const cache=cacheRaw?JSON.parse(cacheRaw):null;
    let data;
    if (cache && Date.now()-cache.t < 5*60e3){ data=cache.d; }
    else {
      const r=await fetch('https://ll.thespacedevs.com/2.2.0/launch/upcoming/?lsp__id=121&limit=40&mode=detailed&hide_recent_previous=true&format=json');
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); data=j.results;
      localStorage.setItem('padcache', JSON.stringify({t:Date.now(), d:data}));
    }
    applyLive(data); note('live · LL2 (cached 5m, ~15 req/hr free tier).');
  }catch(e){ DATA='mock'; seedMock(Date.now()); buildModels(); }
}
function applyLive(results){
  for (const p of PADS){ p.veh=null; p.net=null; p.status='CLEAR'; p.phase='empty'; p.y=0; }
  const byPad={};
  for (const L of results){ const pid=L.pad&&L.pad.id; if(pid==null) continue;
    if(!byPad[pid] || new Date(L.net)<new Date(byPad[pid].net)) byPad[pid]=L; }
  for (const p of PADS){ const L=byPad[p.id]; if(!L) continue;
    p.net=new Date(L.net).getTime(); p.veh=classify(L);
    const ab=(L.status&&L.status.abbrev)||''; p.status = ab==='Go'?'GO':ab==='TBC'?'TBC':(ab||'TBD').toUpperCase();
  }
  // starship 39A tower still WIP if nothing manifested
  if (!byPad[203]) PADS[5].status='WIP';
}
function classify(L){
  const cfg=((L.rocket&&L.rocket.configuration)||{});
  const fam=(cfg.name||cfg.full_name||'').toLowerCase();
  const mis=((L.mission&&L.mission.name)||L.name||'').toLowerCase();
  if (fam.includes('starship')||fam.includes('super heavy')){
    return (mis.includes('booster')||mis.includes('static')) ? 'booster' : 'shipStacked';
  }
  if (mis.includes('dragon')||mis.includes('crew')||mis.includes('crs')||mis.includes('cargo')||mis.includes('axiom')||mis.includes('polaris'))
    return 'f9dragon';
  return 'f9fairing';
}

/* ----------------------------------------- keys (optional power-user) */
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if (k==='escape'){ FOCUS=null; return; }
  if (k==='1') PAL=PALETTES.neon; else if (k==='2') PAL=PALETTES.vtrue; else if (k==='3') PAL=PALETTES.crt;
  else if (k==='c') CAM = CAM==='auto'?'orbit':CAM==='orbit'?'fixed':CAM==='fixed'?'front':'auto';
  else if (k==='p') PLUME = PLUME==='cone'?'particles':PLUME==='particles'?'solid':'cone';
  else if (k==='l') launchNext();
  else if (k==='m'){ DATA = DATA==='mock'?'live':'mock'; if(DATA==='live') goLive(); else seedMock(Date.now()); }
  else return;
  buildModels();
});

/* --------------------------------------------------------------- go */
buildModels(); seedMock(Date.now());
requestAnimationFrame(frame);
</script>
